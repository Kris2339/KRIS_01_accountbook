      assets: [
        { id: '1', name: '입출금 통장', balance: 0, displayOrder: 1, isFavorite: true, budget: 0 },
        { id: '2', name: '자동차 통장', balance: 0, displayOrder: 2, isFavorite: true, budget: 0 },
        { id: '3', name: '생활비 통장', balance: 0, displayOrder: 3, isFavorite: true, budget: 0 }
      ],

      categories: [
        { id: '1', name: '급여', icon: '💰', type: 'income', displayOrder: 1, isFavorite: true },
        { id: '2', name: '부수입', icon: '💵', type: 'income', displayOrder: 2, isFavorite: true },
        { id: '3', name: '식비', icon: '🍚', type: 'expense', displayOrder: 1, isFavorite: true },
        { id: '4', name: '카페', icon: '☕', type: 'expense', displayOrder: 2, isFavorite: true },
        { id: '5', name: '교통', icon: '🚌', type: 'expense', displayOrder: 3, isFavorite: true },
        { id: '6', name: '쇼핑', icon: '🛒', type: 'expense', displayOrder: 4, isFavorite: true },
        { id: '7', name: '생활', icon: '🏠', type: 'expense', displayOrder: 5, isFavorite: false },
        { id: '8', name: '취미', icon: '🎮', type: 'expense', displayOrder: 6, isFavorite: false },
        { id: '9', name: '의료', icon: '🏥', type: 'expense', displayOrder: 7, isFavorite: false },
        { id: '10', name: '경조사', icon: '🎁', type: 'expense', displayOrder: 8, isFavorite: false },
        { id: '11', name: '미용', icon: '💇', type: 'expense', displayOrder: 9, isFavorite: false },
        { id: '12', name: '기타', icon: '📦', type: 'expense', displayOrder: 10, isFavorite: false }
      ],

      transactions: [],
      monthlyBudget: 0,
      categoryBudgets: {},
      statsFilter: 'month',
      searchQuery: '',
      lastDeleted: null,
      pendingSyncCount: 0,
      lastSavedAt: null,
      lastSyncStatus: 'local',
      lastCalendarTap: null,
      expandedSections: {
        category: false,
        paymentMethod: false
      },

      useLocalStorage: true,
      cloudAvailable: false,
      remoteRevision: 0,
      syncConflict: null,
      trendChart: null,
      activeReportPane: 'budget',
      uiPreferences: {
        deviceUserId: null,
        calendarAmountMode: 'full',
        lastPaymentMethodId: null,
        lastAssetId: null
      }
    };

    let toastTimer = null;

    // ============================================
    // 유틸리티 함수
    // ============================================
    function formatNumber(num) {
      const numStr = String(num).replace(/[^\d]/g, '');
      if (!numStr) return '';
      return new Intl.NumberFormat('ko-KR').format(parseInt(numStr));
    }

    function parseFormattedNumber(str) {
      return parseInt(String(str).replace(/[^\d]/g, '')) || 0;
    }

    function formatAmount(amount) {
      return new Intl.NumberFormat('ko-KR').format(amount) + '원';
    }

    function formatMoney(amount) {
      return new Intl.NumberFormat('ko-KR').format(amount) + '원';
    }

    function formatCompactMoney(amount) {
      if (amount >= 100000000) return `${(amount / 100000000).toFixed(amount % 100000000 ? 1 : 0)}억`;
      if (amount >= 10000) return `${(amount / 10000).toFixed(amount % 10000 ? 1 : 0)}만`;
      return new Intl.NumberFormat('ko-KR').format(amount);
    }

    function showToast(message) {
      const toast = document.getElementById('appToast');
      if (!toast) return;
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function loadUiPreferences() {
      try {
        const saved = JSON.parse(localStorage.getItem('household_ui_preferences_v1') || '{}');
        state.uiPreferences = { ...state.uiPreferences, ...saved };
      } catch (error) {
        console.warn('화면 설정을 불러오지 못했습니다.', error);
      }
    }

    function saveUiPreferences() {
      localStorage.setItem('household_ui_preferences_v1', JSON.stringify(state.uiPreferences));
      renderUiPreferencesSettings();
    }

    function getDeviceUser() {
      return state.users.find(user => user.id === state.uiPreferences.deviceUserId) || state.users[0] || null;
    }

    function getMonthSelectionDate(date) {
      const today = new Date();
      if (date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth()) {
        return formatDate(today);
      }
      return formatDate(new Date(date.getFullYear(), date.getMonth(), 1));
    }

    function setCurrentMonth(date) {
      state.currentDate = new Date(date.getFullYear(), date.getMonth(), 1);
      state.selectedDate = getMonthSelectionDate(state.currentDate);
      document.body.setAttribute('data-has-selected', state.selectedDate === formatDate(new Date()) ? 'false' : 'true');
      renderAll();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function addMonthsClamped(dateValue, months) {
      const source = new Date(`${dateValue}T12:00:00`);
      const day = source.getDate();
      const target = new Date(source.getFullYear(), source.getMonth() + months, 1, 12);
      const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
      target.setDate(Math.min(day, lastDay));
      return formatDate(target);
    }

    function escapeHTML(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeAttr(value) {
      return escapeHTML(value);
    }

    function getSerializableData() {
      return {
        users: state.users,
        paymentMethods: state.paymentMethods,
        assets: state.assets,
        categories: state.categories,
        transactions: state.transactions,
        monthlyBudget: state.monthlyBudget,
        categoryBudgets: state.categoryBudgets,
        lastSavedAt: state.lastSavedAt
      };
    }

    function formatDate(date) {
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDateKo(date) {
      const d = new Date(date);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    }

    function getMonthRange(date) {
      const start = new Date(date.getFullYear(), date.getMonth(), 1);
      start.setHours(0, 0, 0, 0);
      const end = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function getWeekRange(date) {
      const start = new Date(date);
      start.setDate(date.getDate() - date.getDay());
      start.setHours(0, 0, 0, 0);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function getYearRange(date) {
      const start = new Date(date.getFullYear(), 0, 1);
      start.setHours(0, 0, 0, 0);
      const end = new Date(date.getFullYear(), 11, 31);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function getStatsPeriodRange() {
      if (state.statsFilter === 'week') {
        return getWeekRange(state.currentDate);
      } else if (state.statsFilter === 'year') {
        return getYearRange(state.currentDate);
      } else {
        return getMonthRange(state.currentDate);
      }
    }

    function getPreviousStatsPeriodRange() {
      if (state.statsFilter === 'week') {
        const previousWeek = new Date(state.currentDate);
        previousWeek.setDate(previousWeek.getDate() - 7);
        return getWeekRange(previousWeek);
      }
      if (state.statsFilter === 'year') {
        return getYearRange(new Date(state.currentDate.getFullYear() - 1, 0, 1));
      }
      return getMonthRange(new Date(state.currentDate.getFullYear(), state.currentDate.getMonth() - 1, 1));
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // ============================================
    // 데이터 저장/로드
    // ============================================
    function updateSyncStatus() {
      const statusCard = document.getElementById('syncStatusCard');
      const statusText = document.getElementById('syncStatusText');
      const lastSavedText = document.getElementById('lastSavedText');
      const pendingSyncText = document.getElementById('pendingSyncText');
      const globalSyncPill = document.getElementById('globalSyncPill');
      if (!statusCard || !statusText || !lastSavedText || !pendingSyncText) return;

      const statusLabels = {
        local: '로컬 저장 모드',
        pending: '클라우드 저장 대기 중',
        synced: '클라우드 동기화 완료',
        failed: '클라우드 저장 실패',
        conflict: '다른 기기의 변경 확인 필요'
      };

      statusCard.classList.toggle(
        'warning',
        state.lastSyncStatus === 'failed' || state.lastSyncStatus === 'conflict' || state.pendingSyncCount > 0
      );
      statusText.textContent = statusLabels[state.lastSyncStatus] || statusLabels.local;
      lastSavedText.textContent = `마지막 저장: ${state.lastSavedAt ? new Date(state.lastSavedAt).toLocaleString('ko-KR') : '-'}`;
      pendingSyncText.textContent = `대기 중인 변경: ${state.pendingSyncCount}건`;
      if (globalSyncPill) {
        const shortLabels = {
          local: '이 기기에 저장됨',
          pending: '저장 중…',
          synced: '저장 완료',
          failed: '저장 실패',
          conflict: '변경 확인 필요'
        };
        globalSyncPill.textContent = shortLabels[state.lastSyncStatus] || shortLabels.local;
        globalSyncPill.className = `global-sync-pill ${state.lastSyncStatus}`;
      }
    }

    function saveLocalData() {
      state.lastSavedAt = new Date().toISOString();
      localStorage.setItem('household_data', JSON.stringify(getSerializableData()));
      updateSyncStatus();
    }

    async function saveToCloud() {
      if (!state.cloudAvailable) return false;

      try {
        const response = await fetch('/api/data', {
          method: 'PUT',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            baseRevision: state.remoteRevision,
            data: getSerializableData()
          })
        });
        const result = await response.json();

        if (response.status === 409) {
          state.syncConflict = result.server || null;
          state.lastSyncStatus = 'conflict';
          showToast('다른 기기의 변경이 있어 확인이 필요합니다.');
          throw new Error('다른 기기에서 먼저 저장했습니다. 수동 동기화로 최신 데이터를 확인해 주세요.');
        }
        if (!response.ok) throw new Error(result.error || '클라우드 저장에 실패했습니다.');

        state.remoteRevision = result.revision;
        state.pendingSyncCount = 0;
        state.lastSyncStatus = 'synced';
        state.syncConflict = null;
        return true;
      } catch (error) {
        if (state.lastSyncStatus !== 'conflict') state.lastSyncStatus = 'failed';
        if (state.lastSyncStatus === 'failed') showToast('클라우드 저장에 실패했습니다. 로컬 사본은 보관됐어요.');
        console.error('클라우드 저장 실패:', error);
        return false;
      } finally {
        updateSyncStatus();
      }
    }

    // 이전 함수명은 기존 이벤트 코드와의 호환을 위해 유지합니다.
    const saveToSupabase = saveToCloud;
    const debouncedSyncToCloud = debounce(saveToCloud, 1200);

    function saveData() {
      saveLocalData();
      if (state.cloudAvailable) {
        state.pendingSyncCount += 1;
        state.lastSyncStatus = 'pending';
        updateSyncStatus();
        debouncedSyncToCloud();
      }
    }

    function loadLocalData() {
      const saved = localStorage.getItem('household_data');
      if (saved) {
        try {
          const data = JSON.parse(saved);
          state.users = data.users || state.users;
          state.paymentMethods = data.paymentMethods || state.paymentMethods;
          state.assets = data.assets || state.assets;
          state.categories = data.categories || state.categories;
          state.transactions = data.transactions || [];
          state.monthlyBudget = data.monthlyBudget || 0;
          state.categoryBudgets = data.categoryBudgets || {};
          state.lastSavedAt = data.lastSavedAt || state.lastSavedAt;
        } catch (error) {
          console.error('localStorage 데이터 복구 실패:', error);
          localStorage.setItem(`household_data_corrupt_${Date.now()}`, saved);
          localStorage.removeItem('household_data');
        }
      }
    }

    function applyCloudPayload(payload) {
      state.users = payload.users || state.users;
      state.paymentMethods = payload.paymentMethods || state.paymentMethods;
      state.assets = payload.assets || state.assets;
      state.categories = payload.categories || state.categories;
      state.transactions = payload.transactions || [];
      state.monthlyBudget = payload.monthlyBudget || 0;
      state.categoryBudgets = payload.categoryBudgets || {};
      state.lastSavedAt = payload.lastSavedAt || state.lastSavedAt;
    }

    async function loadFromCloud() {
      try {
        const response = await fetch('/api/data', { headers: { accept: 'application/json' } });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '클라우드 데이터를 불러오지 못했습니다.');

        state.cloudAvailable = true;
        state.useLocalStorage = false;
        state.remoteRevision = result.revision || 0;

        if (result.initialized) {
          preserveLocalBeforeCloudOverwrite(result.data || {}, result.revision || 0);
          applyCloudPayload(result.data || {});
          state.pendingSyncCount = 0;
          state.lastSyncStatus = 'synced';
          saveLocalData();
        } else {
          // 새 DB에서는 휴대폰에 남아 있는 로컬 데이터를 자동 덮어쓰지 않습니다.
          // 설정의 수동 동기화를 누를 때만 최초 업로드합니다.
          state.lastSyncStatus = state.transactions.length ? 'pending' : 'synced';
          state.pendingSyncCount = state.transactions.length ? 1 : 0;
        }
        return true;
      } catch (error) {
        state.cloudAvailable = false;
        state.useLocalStorage = true;
        state.lastSyncStatus = 'local';
        console.error('클라우드 로드 실패, 로컬 데이터를 유지합니다:', error);
        return false;
      } finally {
        updateSyncStatus();
      }
    }

    const loadFromSupabase = loadFromCloud;

    async function loadData() {
      loadLocalData();
    }

    function downloadJSON(filename, data) {
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function preserveLocalBeforeCloudOverwrite(cloudData, revision) {
      if (!state.transactions.length) return;

      const localIds = state.transactions.map((item) => String(item.id)).sort().join('|');
      const cloudIds = (cloudData.transactions || []).map((item) => String(item.id)).sort().join('|');
      if (localIds === cloudIds) return;

      const backupKey = `household_recovery_before_cloud_${Date.now()}`;
      localStorage.setItem(backupKey, JSON.stringify({
        reason: 'cloud-overwrite-protection',
        cloudRevision: revision,
        createdAt: new Date().toISOString(),
        data: getSerializableData()
      }));

      Object.keys(localStorage)
        .filter((key) => key.startsWith('household_recovery_before_cloud_'))
        .sort()
        .reverse()
        .slice(3)
        .forEach((key) => localStorage.removeItem(key));
    }

    function exportLatestRecoveryBackup() {
      const key = Object.keys(localStorage)
        .filter((item) => item.startsWith('household_recovery_before_cloud_'))
        .sort()
        .reverse()[0];
      if (!key) {
        alert('보관된 이전 로컬 사본이 없습니다.');
        return;
      }

      const backup = JSON.parse(localStorage.getItem(key));
      downloadJSON(`household-recovery-${formatDate(new Date())}.json`, backup);
    }

    function exportData() {
      downloadJSON(`household-data-${formatDate(new Date())}.json`, {
        exportedAt: new Date().toISOString(),
        data: getSerializableData()
      });
    }

    function applyImportedData(data) {
      const payload = data && data.data ? data.data : data;
      if (!payload || !Array.isArray(payload.transactions)) {
        showToast('가져올 수 없는 데이터 형식입니다.');
        return;
      }

      state.users = Array.isArray(payload.users) ? payload.users : state.users;
      state.paymentMethods = Array.isArray(payload.paymentMethods) ? payload.paymentMethods : state.paymentMethods;
      state.assets = Array.isArray(payload.assets) ? payload.assets : state.assets;
      state.categories = Array.isArray(payload.categories) ? payload.categories : state.categories;
      state.transactions = payload.transactions;
      state.monthlyBudget = Number(payload.monthlyBudget || 0);
      state.categoryBudgets = payload.categoryBudgets || {};
      state.lastSavedAt = new Date().toISOString();
      saveData();
      renderAll();
      showToast(`거래 ${state.transactions.length}건을 가져왔어요.`);
    }

    function importDataFromFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          applyImportedData(JSON.parse(reader.result));
        } catch (error) {
          console.error('데이터 가져오기 실패:', error);
          showToast('JSON 파일을 읽을 수 없습니다.');
        }
      };
      reader.readAsText(file);
    }

    function createMonthlyBackupSnapshot() {
      const { start, end } = getMonthRange(state.currentDate);
      const monthTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end;
      });
      const monthKey = `${state.currentDate.getFullYear()}-${String(state.currentDate.getMonth() + 1).padStart(2, '0')}`;
      const snapshot = {
        month: monthKey,
        createdAt: new Date().toISOString(),
        data: {
          ...getSerializableData(),
          transactions: monthTransactions
        }
      };

      localStorage.setItem(`household_backup_${monthKey}`, JSON.stringify(snapshot));
      downloadJSON(`household-backup-${monthKey}.json`, snapshot);
    }

    function undoLastDelete() {
      if (!state.lastDeleted) {
        showToast('되돌릴 삭제 내역이 없습니다.');
        return;
      }

      const { type, item, index } = state.lastDeleted;
      if (type === 'transactions') {
        state.transactions.splice(Math.min(index, state.transactions.length), 0, item);
      } else if (state[type]) {
        state[type].splice(Math.min(index, state[type].length), 0, item);
      }

      state.lastDeleted = null;
      saveData();
      renderAll();
    }

    // ============================================
    // 렌더링 함수
    // ============================================

    // Lookup 맵 생성 함수 (성능 최적화)
    function createLookupMaps() {
      return {
        users: new Map(state.users.map(u => [u.id, u])),
        categories: new Map(state.categories.map(c => [c.id, c])),
        assets: new Map(state.assets.map(a => [a.id, a])),
        paymentMethods: new Map(state.paymentMethods.map(p => [p.id, p]))
      };
    }

    function updateMonthDisplay() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth() + 1;
      document.getElementById('currentMonth').textContent = `${year}년 ${month}월`;
      const reportPeriodTitle = document.getElementById('reportPeriodTitle');
      if (reportPeriodTitle) reportPeriodTitle.textContent = `${year}년 ${month}월 살림`;
    }

    function updateSummary() {
      const { start, end } = getMonthRange(state.currentDate);
      let monthTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end;
      });

      // 사용자 필터 적용
      if (state.calendarUserFilter !== 'all') {
        monthTransactions = monthTransactions.filter(t => t.userId === state.calendarUserFilter);
      }

      const income = monthTransactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + t.amount, 0);

      const expense = monthTransactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + t.amount, 0);

      const balance = income - expense;

      document.getElementById('totalIncome').textContent = '+' + formatMoney(income);
      document.getElementById('totalExpense').textContent = '-' + formatMoney(expense);
      document.getElementById('totalBalance').textContent = (balance >= 0 ? '+' : '') + formatMoney(balance);
    }

    // 금액을 포맷팅 (달력용) - 전체 숫자 표시, 길이에 따라 폰트 크기 자동 조정
    function formatCalendarAmount(amount) {
      if (state.uiPreferences.calendarAmountMode === 'compact') {
        return { text: formatCompactMoney(amount), fontClass: '' };
      }
      const text = amount.toLocaleString();
      const len = text.length;

      // 더 세밀한 폰트 크기 조정으로 항상 보이도록
      if (len >= 11) {
        return { text, fontClass: 'micro-font' };  // 6자리 이상 (예: 1,000,000+)
      } else if (len >= 9) {
        return { text, fontClass: 'tiny-font' };   // 9-10자리 (예: 100,000+)
      } else if (len >= 7) {
        return { text, fontClass: 'small-font' };  // 7-8자리 (예: 10,000+)
      } else {
        return { text, fontClass: '' };            // 6자리 이하
      }
    }

    function renderCalendar() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const startDay = new Date(firstDay);
      startDay.setDate(startDay.getDate() - firstDay.getDay());

      const endDay = new Date(lastDay);
      endDay.setDate(endDay.getDate() + (6 - lastDay.getDay()));

      let html = '';

      const dayHeaders = ['일', '월', '화', '수', '목', '금', '토'];
      dayHeaders.forEach((day, index) => {
        let className = 'calendar-day-header';
        if (index === 0) className += ' sun';
        if (index === 6) className += ' sat';
        html += `<div class="${className}">${day}</div>`;
      });

      const current = new Date(startDay);
      const todayStr = formatDate(new Date());

      while (current <= endDay) {
        const dateStr = formatDate(current);
        const isCurrentMonth = current.getMonth() === month;
        const isToday = todayStr === dateStr;
        const isSelected = state.selectedDate === dateStr;
        const dayOfWeek = current.getDay();

        let dayTransactions = state.transactions.filter(t => t.transactionDate === dateStr);

        // 사용자 필터 적용
        if (state.calendarUserFilter !== 'all') {
          dayTransactions = dayTransactions.filter(t => t.userId === state.calendarUserFilter);
        }

        const income = dayTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
        const expense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

        let className = 'calendar-day';
        if (!isCurrentMonth) className += ' other-month';
        if (isToday) className += ' today';
        if (isSelected) className += ' selected';
        if (dayOfWeek === 0) className += ' sun';
        if (dayOfWeek === 6) className += ' sat';

        const incomeFormatted = income > 0 ? formatCalendarAmount(income) : null;
        const expenseFormatted = expense > 0 ? formatCalendarAmount(expense) : null;
        const amountMode = state.uiPreferences.calendarAmountMode || 'full';
        const amountMarkup = amountMode === 'dots'
          ? `<div class="calendar-day-dots">
              ${income > 0 ? '<span class="calendar-day-dot income"></span>' : ''}
              ${expense > 0 ? '<span class="calendar-day-dot expense"></span>' : ''}
            </div>`
          : `<div class="calendar-day-amounts">
              ${income > 0 ? `<div class="calendar-day-amount income ${incomeFormatted.fontClass}">+${incomeFormatted.text}</div>` : ''}
              ${expense > 0 ? `<div class="calendar-day-amount expense ${expenseFormatted.fontClass}">-${expenseFormatted.text}</div>` : ''}
            </div>`;
        const amountLabel = [
          income > 0 ? `수입 ${formatMoney(income)}` : '',
          expense > 0 ? `지출 ${formatMoney(expense)}` : ''
        ].filter(Boolean).join(', ');

        html += `
          <button type="button" class="${className}" aria-label="${current.getMonth() + 1}월 ${current.getDate()}일${amountLabel ? `, ${amountLabel}` : ''}" onclick="onCalendarDayClick('${dateStr}')" ondblclick="onCalendarDayDoubleClick('${dateStr}')">
            <div class="calendar-day-number">${current.getDate()}</div>
            ${(income > 0 || expense > 0) ? amountMarkup : ''}
          </button>
        `;

        current.setDate(current.getDate() + 1);
      }

      document.getElementById('calendarGrid').innerHTML = html;
    }

    function onCalendarDayClick(dateStr) {
      const now = Date.now();
      const isDoubleTap = state.lastCalendarTap &&
        state.lastCalendarTap.dateStr === dateStr &&
        now - state.lastCalendarTap.time < 350;
      state.lastCalendarTap = { dateStr, time: now };

      state.selectedDate = dateStr;
      const todayStr = formatDate(new Date());
      // 오늘이 아닌 다른 날짜를 선택했을 때 body에 표시
      document.body.setAttribute('data-has-selected', dateStr !== todayStr ? 'true' : 'false');
      renderQuickEntryPanel();
      renderCalendar();
      renderSelectedDateTransactions(dateStr);

      if (isDoubleTap) {
        openTransactionModal({ type: 'expense', date: dateStr });
      }
    }

    function onCalendarDayDoubleClick(dateStr) {
      state.selectedDate = dateStr;
      openTransactionModal({ type: 'expense', date: dateStr });
    }

    function renderQuickEntryPanel() {
      const panel = document.getElementById('quickEntryPanel');
      if (!panel) return;

      const favoriteExpenses = state.categories
        .filter(category => category.type === 'expense' && category.isFavorite)
        .sort((a, b) => a.displayOrder - b.displayOrder)
        .slice(0, 4);

      const deviceUser = getDeviceUser();

      const chips = favoriteExpenses.map(category => `
        <button class="quick-entry-chip" onclick="openQuickExpense('${escapeAttr(category.id)}')">
          ${category.icon ? `<span>${escapeHTML(category.icon)}</span>` : ''}
          <span>${escapeHTML(category.name)}</span>
        </button>
      `).join('');

      panel.innerHTML = `
        <div class="quick-entry-header">
          <div>
            <div class="quick-entry-title">빠른 지출 입력</div>
            <div class="quick-entry-person">${deviceUser ? `${escapeHTML(deviceUser.name)}으로 입력` : '사용자를 선택해 주세요'}</div>
          </div>
          <div class="quick-entry-date">${state.selectedDate ? formatDateKo(state.selectedDate) : '오늘'}</div>
        </div>
        <div class="quick-entry-actions">
          <button class="quick-entry-chip primary" onclick="openTransactionModal({ type: 'expense', date: state.selectedDate })">+ 새 지출 입력</button>
          ${chips}
        </div>
      `;
    }

    function renderSelectedDateTransactions(dateStr) {
      let dayTransactions = state.transactions.filter(t => t.transactionDate === dateStr);

      // 사용자 필터 적용
      if (state.calendarUserFilter !== 'all') {
        dayTransactions = dayTransactions.filter(t => t.userId === state.calendarUserFilter);
      }

      document.getElementById('calendarSelectedDate').textContent = formatDateKo(dateStr);

      if (dayTransactions.length === 0) {
        document.getElementById('calendarTransactionList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-text">이 날짜에 거래 내역이 없습니다</div>
          </div>
        `;
        return;
      }

      // Lookup 맵 생성 (성능 최적화)
      const lookups = createLookupMaps();

      // 모든 거래를 하나의 카드에 리스트로 표시
      let html = '<div class="calendar-transaction-card">';
      html += dayTransactions.map(t => renderCalendarTransactionItem(t, lookups)).join('');
      html += '</div>';
      document.getElementById('calendarTransactionList').innerHTML = html;
    }

    function renderCalendarTransactionItem(t, lookups) {
      const user = lookups.users.get(t.userId);
      const category = lookups.categories.get(t.categoryId);

      const amountClass = t.type === 'income' ? 'income' : (t.type === 'expense' ? 'expense' : 'transfer');
      const amountPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');

      const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${escapeHTML(category.icon)}</span>${escapeHTML(category.name)}` : escapeHTML(category.name)) : (t.type === 'transfer' ? '자산이동' : '');

      return `
        <div class="calendar-transaction-row" onclick="openTransactionDetailModal('${t.id}')">
          <div class="calendar-transaction-info">
            <div class="calendar-transaction-main">
              ${user ? `<span class="transaction-user">${escapeHTML(user.name)}</span>` : ''}
              <div class="transaction-category">${categoryDisplay}</div>
            </div>
            ${t.memo ? `<div class="transaction-memo">${escapeHTML(t.memo)}</div>` : ''}
          </div>
          <div class="transaction-amount ${amountClass}">
            ${amountPrefix}${formatMoney(t.amount)}
          </div>
        </div>
      `;
    }

    function renderTransactionList() {
      const { start, end } = getMonthRange(state.currentDate);
      let transactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end;
      });

      // 사용자 필터 적용
      if (state.calendarUserFilter && state.calendarUserFilter !== 'all') {
        transactions = transactions.filter(t => t.userId === state.calendarUserFilter);
      }

      const monthExpense = transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);
      const monthIncome = transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
      const logMonthTitle = document.getElementById('logMonthTitle');
      const logMonthTotal = document.getElementById('logMonthTotal');
      if (logMonthTitle) logMonthTitle.textContent = `${state.currentDate.getFullYear()}년 ${state.currentDate.getMonth() + 1}월`;
      if (logMonthTotal) {
        logMonthTotal.textContent = monthIncome > 0
          ? `수입 ${formatCompactMoney(monthIncome)} · 지출 ${formatCompactMoney(monthExpense)}`
          : `지출 ${formatMoney(monthExpense)}`;
      }

      if (state.logFilter !== 'all') {
        transactions = transactions.filter(t => t.type === state.logFilter);
      }

      // Lookup 맵 생성 (성능 최적화)
      const lookups = createLookupMaps();

      if (state.searchQuery) {
        const query = state.searchQuery.toLowerCase();
        const numericQuery = query.replace(/[^\d]/g, '');
        transactions = transactions.filter(t => {
          const category = lookups.categories.get(t.categoryId);
          const paymentMethod = lookups.paymentMethods.get(t.paymentMethodId);
          const user = lookups.users.get(t.userId);
          const asset = lookups.assets.get(t.assetId);

          return (
            (t.memo && t.memo.toLowerCase().includes(query)) ||
            (category && category.name.toLowerCase().includes(query)) ||
            (paymentMethod && paymentMethod.name.toLowerCase().includes(query)) ||
            (user && user.name.toLowerCase().includes(query)) ||
            (asset && asset.name.toLowerCase().includes(query)) ||
            (numericQuery && String(t.amount).includes(numericQuery)) ||
            String(t.transactionDate || '').includes(query)
          );
        });
      }

      transactions.sort((a, b) => new Date(b.transactionDate) - new Date(a.transactionDate));

      let html = '';
      if (transactions.length === 0) {
        html = '<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-text">거래 내역이 없습니다</div></div>';
      } else {
        // 날짜별로 그룹화
        const groupedByDate = {};
        transactions.forEach(t => {
          if (!groupedByDate[t.transactionDate]) {
            groupedByDate[t.transactionDate] = [];
          }
          groupedByDate[t.transactionDate].push(t);
        });

        // 날짜별 카드 생성
        Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
          const dayTransactions = groupedByDate[date];
          const dayIncome = dayTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
          const dayExpense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          html += `<div class="date-group-card">
            <div class="date-group-header">
              <span class="date-group-date">${formatDateKo(date)}</span>
              <span class="date-group-summary">
                ${dayIncome > 0 ? `<span class="income">+${formatMoney(dayIncome)}</span>` : ''}
                ${dayExpense > 0 ? `<span class="expense">-${formatMoney(dayExpense)}</span>` : ''}
              </span>
            </div>
            <div class="date-group-items">
              ${dayTransactions.map(t => renderTransactionItemCompact(t, lookups)).join('')}
            </div>
          </div>`;
        });
      }

      document.getElementById('transactionList').innerHTML = html;
    }

    // 날짜 그룹 내에서 사용할 간단한 거래 아이템 (성능 최적화 버전)
    function renderTransactionItemCompact(t, lookups) {
      const user = lookups.users.get(t.userId);
      const category = lookups.categories.get(t.categoryId);
      const paymentMethod = lookups.paymentMethods.get(t.paymentMethodId);
      const asset = lookups.assets.get(t.assetId);
      const toAsset = t.toAssetId ? lookups.assets.get(t.toAssetId) : null;

      const amountClass = t.type === 'income' ? 'income' : (t.type === 'expense' ? 'expense' : 'transfer');
      const amountPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');
      const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${escapeHTML(category.icon)}</span>${escapeHTML(category.name)}` : escapeHTML(category.name)) : (t.type === 'transfer' ? '자산이동' : '');
      const contextDisplay = t.type === 'transfer'
        ? `${asset?.name || ''} → ${toAsset?.name || ''}`
        : [paymentMethod?.name, asset?.name].filter(Boolean).join(' · ');

      return `
        <div class="date-group-item" onclick="openTransactionDetailModal('${t.id}')">
          <div class="date-group-item-left">
            ${user ? `<span class="transaction-user">${escapeHTML(user.name)}</span>` : ''}
            <span class="transaction-category">${categoryDisplay}</span>
            ${t.memo ? `<span class="transaction-memo-inline">${escapeHTML(t.memo)}</span>` : ''}
            ${contextDisplay ? `<span class="transaction-context-inline">${escapeHTML(contextDisplay)}</span>` : ''}
          </div>
          <div class="transaction-amount ${amountClass}">
            ${amountPrefix}${formatMoney(t.amount)}
          </div>
        </div>
      `;
    }

    function renderTransactionItem(t, showDate = false) {
      const user = state.users.find(u => u.id === t.userId);
      const category = state.categories.find(c => c.id === t.categoryId);
      const paymentMethod = state.paymentMethods.find(p => p.id === t.paymentMethodId);
      const asset = state.assets.find(a => a.id === t.assetId);
      const toAsset = t.toAssetId ? state.assets.find(a => a.id === t.toAssetId) : null;

      let methodText = '';
      if (t.type === 'transfer') {
        methodText = `${asset?.name || ''} -> ${toAsset?.name || ''}`;
      } else {
        methodText = `${paymentMethod?.name || ''} · ${asset?.name || ''}`;
      }

      const amountClass = t.type === 'income' ? 'income' : (t.type === 'expense' ? 'expense' : 'transfer');
      const amountPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');

      const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${escapeHTML(category.icon)}</span>${escapeHTML(category.name)}` : escapeHTML(category.name)) : (t.type === 'transfer' ? '자산이동' : '');

      const dateDisplay = showDate ? formatDateKo(t.transactionDate) : '';

      return `
        <div class="transaction-item" onclick="openTransactionDetailModal('${t.id}')">
          <div class="transaction-left">
            ${showDate ? `<span class="transaction-date-badge">${dateDisplay}</span>` : ''}
            ${user ? `<span class="transaction-user">${escapeHTML(user.name)}</span>` : ''}
            <div class="transaction-category">${categoryDisplay}</div>
            ${methodText ? `<div class="transaction-method">${escapeHTML(methodText)}</div>` : ''}
            ${t.memo ? `<div class="transaction-method">${escapeHTML(t.memo)}</div>` : ''}
          </div>
          <div class="transaction-amount ${amountClass}">
            ${amountPrefix}${formatMoney(t.amount)}
          </div>
        </div>
      `;
    }

    function renderAssetsList() {
      const { start, end } = getMonthRange(state.currentDate);
      const today = new Date();
      const currentMonth = state.currentDate.getMonth();
      const currentYear = state.currentDate.getFullYear();

      // 이번달 총 일수 및 남은 일수 계산
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const daysPassed = today.getMonth() === currentMonth && today.getFullYear() === currentYear
        ? today.getDate()
        : (today > end ? daysInMonth : 0);
      const daysRemaining = daysInMonth - daysPassed;
      const daysPassedPercent = (daysPassed / daysInMonth) * 100;

      // 월 전체 예산 및 지출 합계
      let totalBudget = 0;
      let totalSpent = 0;

      const sortedAssets = [...state.assets].sort((a, b) => a.displayOrder - b.displayOrder);
      const budgetedAssetIds = new Set(sortedAssets.filter(asset => Number(asset.budget || 0) > 0).map(asset => asset.id));
      const allExpenseTransactions = state.transactions.filter(transaction => {
        const transactionDate = new Date(transaction.transactionDate);
        return transactionDate >= start && transactionDate <= end && transaction.type === 'expense';
      });
      const totalActualSpent = allExpenseTransactions.reduce((sum, transaction) => sum + transaction.amount, 0);
      const unbudgetedSpent = allExpenseTransactions
        .filter(transaction => !budgetedAssetIds.has(transaction.assetId))
        .reduce((sum, transaction) => sum + transaction.amount, 0);

      sortedAssets.forEach(asset => {
        const budget = asset.budget || 0;

        // 예산이 설정된 자산만 총 예산/지출에 포함
        if (budget > 0) {
          totalBudget += budget;

          const assetTransactions = state.transactions.filter(t => {
            const tDate = new Date(t.transactionDate);
            return tDate >= start && tDate <= end && t.assetId === asset.id && t.type === 'expense';
          });

          totalSpent += assetTransactions.reduce((sum, t) => sum + t.amount, 0);
        }
      });

      const spentPercent = totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0;
      const remainingBudget = totalBudget - totalSpent;

      // 예산 소진 상태 판단
      let statusClass = 'good';
      let statusText = '양호';
      let statusDesc = '';

      if (totalBudget > 0) {
        if (spentPercent > 100) {
          statusClass = 'bad';
          statusText = '예산 초과';
        } else if (daysPassedPercent < 100 && spentPercent > daysPassedPercent + 10) {
          statusClass = 'bad';
          statusText = '빠른 지출';
        } else if (daysPassedPercent < 100 && spentPercent > daysPassedPercent) {
          statusClass = 'warning';
          statusText = '살펴보기';
        }
        statusDesc = daysPassedPercent >= 100
          ? `예산의 ${Math.round(spentPercent)}%를 사용했어요`
          : `날짜 ${Math.round(daysPassedPercent)}% 경과 · 예산 ${Math.round(spentPercent)}% 사용`;
      }

      // 월 요약 표시
      let summaryHtml = `
        <div class="budget-summary-card">
          <div class="budget-summary-header">
            <span class="budget-month">${currentMonth + 1}월 예산 현황</span>
            ${totalBudget > 0 ? `<span class="budget-status ${statusClass}">${statusText}</span>` : ''}
          </div>
          <div class="budget-summary-amounts">
            <div class="budget-summary-item">
              <span class="budget-summary-label">예산</span>
              <span class="budget-summary-value">${formatMoney(totalBudget)}</span>
            </div>
            <div class="budget-summary-item">
              <span class="budget-summary-label">예산 대상</span>
              <span class="budget-summary-value expense">${formatMoney(totalSpent)}</span>
            </div>
            <div class="budget-summary-item">
              <span class="budget-summary-label">남음</span>
              <span class="budget-summary-value ${remainingBudget < 0 ? 'expense' : ''}">${remainingBudget < 0 ? `${formatMoney(Math.abs(remainingBudget))} 초과` : formatMoney(remainingBudget)}</span>
            </div>
          </div>
          ${totalBudget > 0 ? `
            <div class="budget-progress-bar">
              <div class="budget-progress-fill ${statusClass}" style="width: ${Math.min(spentPercent, 100)}%"></div>
              <div class="budget-progress-marker" style="left: ${daysPassedPercent}%"></div>
            </div>
            <div class="budget-summary-desc">${statusDesc}</div>
            <div class="budget-days-info">
              <span>경과: ${daysPassed}일</span>
              <span>남음: ${daysRemaining}일</span>
            </div>
            <div class="budget-breakdown">
              <div class="budget-breakdown-row"><span>이번 달 전체 지출</span><strong>${formatMoney(totalActualSpent)}</strong></div>
              <div class="budget-breakdown-row"><span>예산 대상 지출</span><strong>${formatMoney(totalSpent)}</strong></div>
              <div class="budget-breakdown-row unbudgeted"><span>예산 미설정 지출</span><strong>${formatMoney(unbudgetedSpent)}</strong></div>
            </div>
          ` : '<div class="budget-summary-desc">예산을 설정해주세요</div>'}
        </div>
      `;

      document.getElementById('budgetSummary').innerHTML = summaryHtml;

      // 개별 자산 예산 카드
      let html = sortedAssets.map(asset => {
        const budget = asset.budget || 0;

        const assetTransactions = state.transactions.filter(t => {
          const tDate = new Date(t.transactionDate);
          return tDate >= start && tDate <= end && t.assetId === asset.id && t.type === 'expense';
        });

        const spent = assetTransactions.reduce((sum, t) => sum + t.amount, 0);
        const remaining = budget - spent;

        let progressPercent = 0;
        let progressClass = 'good';

        if (budget > 0) {
          const rawProgressPercent = (spent / budget) * 100;
          progressPercent = Math.min(rawProgressPercent, 100);
          if (rawProgressPercent > 100 || (daysPassedPercent < 100 && rawProgressPercent > daysPassedPercent + 10)) {
            progressClass = 'bad';
          } else if (daysPassedPercent < 100 && rawProgressPercent > daysPassedPercent) {
            progressClass = 'warning';
          }
        }

        return `
          <div class="asset-card" onclick="showAssetTransactions('${escapeAttr(asset.id)}')">
            <div class="asset-header">
              <span class="asset-name">${escapeHTML(asset.name)}</span>
              <span class="asset-budget-remaining ${remaining < 0 ? 'expense' : ''}">${remaining < 0 ? `${formatMoney(Math.abs(remaining))} 초과` : `${formatMoney(remaining)} 남음`}</span>
            </div>
            ${budget > 0 ? `
              <div class="asset-budget-bar">
                <div class="budget-progress ${progressClass}" style="width: ${progressPercent}%"></div>
              </div>
              <div class="asset-budget-info">
                <span>지출 ${formatMoney(spent)}</span>
                <span>예산 ${formatMoney(budget)}</span>
              </div>
            ` : `
              <div class="asset-budget-info">
                <span>지출 ${formatMoney(spent)}</span>
                <span class="no-budget">예산 미설정</span>
              </div>
            `}
          </div>
        `;
      }).join('');

      document.getElementById('assetsList').innerHTML = html;
    }

    function calculateAssetBalance(assetId) {
      let balance = 0;

      state.transactions.forEach(t => {
        if (t.assetId === assetId) {
          if (t.type === 'income') {
            balance += t.amount;
          } else if (t.type === 'expense') {
            balance -= t.amount;
          } else if (t.type === 'transfer') {
            balance -= t.amount;
          }
        }

        if (t.type === 'transfer' && t.toAssetId === assetId) {
          balance += t.amount;
        }
      });

      return balance;
    }

    function showAssetTransactions(assetId) {
      const { start, end } = getMonthRange(state.currentDate);
      const currentMonth = state.currentDate.getMonth() + 1;
      const asset = state.assets.find(a => a.id === assetId);
      const assetName = asset ? asset.name : '자산';

      const assetTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end &&
               (t.assetId === assetId || (t.type === 'transfer' && t.toAssetId === assetId));
      });

      assetTransactions.sort((a, b) => new Date(b.transactionDate) - new Date(a.transactionDate));

      document.getElementById('assetModalTitle').textContent = `${assetName} ${currentMonth}월 내역`;

      if (assetTransactions.length === 0) {
        document.getElementById('assetTransactionsList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div class="empty-state-text">거래 내역이 없습니다</div>
          </div>
        `;
      } else {
        // 날짜별로 그룹화
        const groupedByDate = {};
        assetTransactions.forEach(t => {
          if (!groupedByDate[t.transactionDate]) {
            groupedByDate[t.transactionDate] = [];
          }
          groupedByDate[t.transactionDate].push(t);
        });

        let html = '';
        Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
          const dayTransactions = groupedByDate[date];
          const dayIncome = dayTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
          const dayExpense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          const dateObj = new Date(date);
          const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][dateObj.getDay()];
          const dateDisplay = `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayOfWeek})`;

          html += `<div class="date-group-card">
            <div class="date-group-header">
              <span class="date-group-date">${dateDisplay}</span>
              <div class="date-group-amounts">
                ${dayIncome > 0 ? `<span class="income">+${formatMoney(dayIncome)}</span>` : ''}
                ${dayExpense > 0 ? `<span class="expense">-${formatMoney(dayExpense)}</span>` : ''}
              </div>
            </div>
            <div class="date-group-items">
              ${dayTransactions.map(t => renderTransactionItemCompact(t)).join('')}
            </div>
          </div>`;
        });
        document.getElementById('assetTransactionsList').innerHTML = html;
      }

      document.body.classList.add('modal-open');
      document.getElementById('assetTransactionsModal').classList.add('active');
    }

    function renderStats() {
      const { start, end } = getStatsPeriodRange();
      const previousRange = getPreviousStatsPeriodRange();
      const monthTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end && t.type === 'expense';
      });

      const previousTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= previousRange.start && tDate <= previousRange.end && t.type === 'expense';
      });
      const currentTotal = monthTransactions.reduce((sum, transaction) => sum + transaction.amount, 0);
      const previousTotal = previousTransactions.reduce((sum, transaction) => sum + transaction.amount, 0);
      const difference = currentTotal - previousTotal;
      const comparisonLabel = state.statsFilter === 'year' ? '전년보다' : state.statsFilter === 'week' ? '지난주보다' : '지난달보다';

      let html = `
        <div class="chart comparison-card">
          <div class="chart-title">선택 기간 지출</div>
          <div class="comparison-total">${formatMoney(currentTotal)}</div>
          <div class="comparison-delta ${difference > 0 ? 'expense' : 'income'}">
            ${comparisonLabel} ${difference === 0 ? '같아요' : `${formatMoney(Math.abs(difference))} ${difference > 0 ? '더 썼어요' : '덜 썼어요'}`}
          </div>
        </div>`;

      // 사용자별 지출
      const userExpenses = {};
      state.users.forEach(u => {
        userExpenses[u.id] = monthTransactions
          .filter(t => t.userId === u.id)
          .reduce((sum, t) => sum + t.amount, 0);
      });

      const maxUserExpense = Math.max(...Object.values(userExpenses), 1);

      html += '<div class="chart"><div class="chart-title">사용자별 지출</div><div class="bar-chart">';
      state.users.forEach(user => {
        const amount = userExpenses[user.id] || 0;
        const percent = (amount / maxUserExpense) * 100;
        html += `
          <div class="bar-item">
            <div class="bar-label">
              <span>${escapeHTML(user.name)}</span>
              <span>${formatMoney(amount)}</span>
            </div>
            <div class="bar-bg">
              <div class="bar-fill" style="width: ${percent}%"></div>
            </div>
          </div>
        `;
      });
      html += '</div></div>';

      // 카테고리별 지출
      const categoryExpenses = {};
      monthTransactions.forEach(t => {
        if (!categoryExpenses[t.categoryId]) categoryExpenses[t.categoryId] = 0;
        categoryExpenses[t.categoryId] += t.amount;
      });

      const sortedCategories = Object.entries(categoryExpenses)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      if (sortedCategories.length > 0) {
        const maxCategoryExpense = sortedCategories[0][1];
        html += '<div class="chart"><div class="chart-title">카테고리별 지출</div><div class="bar-chart">';
        sortedCategories.forEach(([catId, amount]) => {
          const category = state.categories.find(c => c.id === catId);
          const percent = (amount / maxCategoryExpense) * 100;
          const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${escapeHTML(category.icon)}</span>${escapeHTML(category.name)}` : escapeHTML(category.name)) : '기타';
          html += `
            <div class="bar-item">
              <div class="bar-label">
                <span>${categoryDisplay}</span>
                <span>${formatMoney(amount)}</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        });
        html += '</div></div>';
      }

      // 결제수단별 지출
      const methodExpenses = {};
      monthTransactions.forEach(t => {
        if (!methodExpenses[t.paymentMethodId]) methodExpenses[t.paymentMethodId] = 0;
        methodExpenses[t.paymentMethodId] += t.amount;
      });

      const sortedMethods = Object.entries(methodExpenses)
        .sort((a, b) => b[1] - a[1]);

      if (sortedMethods.length > 0) {
        const maxMethodExpense = sortedMethods[0][1];
        html += '<div class="chart"><div class="chart-title">결제수단별 지출</div><div class="bar-chart">';
        sortedMethods.forEach(([methodId, amount]) => {
          const method = state.paymentMethods.find(m => m.id === methodId);
          const percent = (amount / maxMethodExpense) * 100;
          html += `
            <div class="bar-item">
              <div class="bar-label">
                <span>${escapeHTML(method?.name || '기타')}</span>
                <span>${formatMoney(amount)}</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        });
        html += '</div></div>';
      }

      document.getElementById('statsCharts').innerHTML = html || '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">통계 데이터가 없습니다</div></div>';

      renderTrendChart();
    }

    function renderTrendChart() {
      const canvas = document.getElementById('trendChart');
      const ctx = canvas.getContext('2d');

      if (state.trendChart) {
        state.trendChart.destroy();
      }

      let labels = [];
      let expenseData = [];

      if (state.statsFilter === 'week') {
        const anchorDate = new Date(state.currentDate);
        for (let i = 6; i >= 0; i--) {
          const date = new Date(anchorDate);
          date.setDate(anchorDate.getDate() - i);
          const dateStr = formatDate(date);

          const dayTransactions = state.transactions.filter(t => t.transactionDate === dateStr);
          const expense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          labels.push(`${date.getMonth() + 1}/${date.getDate()}`);
          expenseData.push(expense);
        }
      } else if (state.statsFilter === 'year') {
        // 연간: 최근 12개월
        for (let i = 11; i >= 0; i--) {
          const date = new Date(state.currentDate);
          date.setMonth(date.getMonth() - i);
          const { start, end } = getMonthRange(date);

          const monthTransactions = state.transactions.filter(t => {
            const tDate = new Date(t.transactionDate);
            return tDate >= start && tDate <= end;
          });

          const expense = monthTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          labels.push(`${date.getMonth() + 1}월`);
          expenseData.push(expense);
        }
      } else {
        // 월간: 최근 6개월
        for (let i = 5; i >= 0; i--) {
          const date = new Date(state.currentDate);
          date.setMonth(date.getMonth() - i);
          const { start, end } = getMonthRange(date);

          const monthTransactions = state.transactions.filter(t => {
            const tDate = new Date(t.transactionDate);
            return tDate >= start && tDate <= end;
          });

          const expense = monthTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          labels.push(`${date.getMonth() + 1}월`);
          expenseData.push(expense);
        }
      }

      state.trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '지출',
              data: expenseData,
              borderColor: '#DC143C',
              backgroundColor: 'rgba(220, 20, 60, 0.1)',
              tension: 0.4,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return value >= 10000 ? (value / 10000) + '만' : value;
                }
              }
            }
          }
        }
      });
    }

    function renderSelectGrid(containerId, items, selectedId, onClick, allowExpand = false) {
      const container = document.getElementById(containerId);
      if (!container) return;

      const isExpanded = state.expandedSections[containerId];
      let displayItems = (allowExpand && !isExpanded)
        ? items.filter(item => item.isFavorite)
        : items;

      // displayOrder로 정렬 (카테고리는 이미 updateTransactionModalForType에서 정렬됨)
      if (displayItems.length > 0 && displayItems[0].displayOrder !== undefined) {
        displayItems = [...displayItems].sort((a, b) => a.displayOrder - b.displayOrder);
      }

      let html = displayItems.map(item => {
        const selected = item.id === selectedId ? 'selected' : '';
        const displayName = item.icon ? `${escapeHTML(item.icon)} ${escapeHTML(item.name)}` : escapeHTML(item.name);
        return `<button type="button" class="select-item ${selected}" aria-pressed="${item.id === selectedId}" onclick="selectItem('${escapeAttr(containerId)}', '${escapeAttr(item.id)}')">${displayName}</button>`;
      }).join('');

      if (allowExpand && items.length > displayItems.length) {
        html += `<button class="expand-toggle" onclick="toggleExpand('${containerId}')">
          ${isExpanded ? '접기 ▲' : `더보기 (${items.length - displayItems.length}개) ▼`}
        </button>`;
      }

      container.innerHTML = html;
    }

    function setupBottomSheetDismissal() {
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        const modal = overlay.querySelector('.modal');
        if (!modal) return;

        let startY = 0;
        let startX = 0;
        let currentY = 0;
        let startScrollTop = 0;
        let tracking = false;
        let dragging = false;
        let activePointerId = null;

        const canStartFromTarget = (target) => {
          const targetElement = target instanceof Element ? target : null;
          return !(targetElement && targetElement.closest('button, input, select, textarea'));
        };

        const beginTracking = (clientX, clientY, target, pointerId = null) => {
          const rect = modal.getBoundingClientRect();
          const isHandleArea = clientY - rect.top < 88;
          if (!canStartFromTarget(target)) return false;
          if (!isHandleArea && modal.scrollTop > 2) return false;

          startX = clientX;
          startY = clientY;
          currentY = startY;
          startScrollTop = modal.scrollTop;
          tracking = true;
          dragging = false;
          activePointerId = pointerId;
          return true;
        };

        const updateDrag = (clientX, clientY) => {
          if (!tracking) return false;

          currentY = clientY;
          const deltaY = currentY - startY;
          const deltaX = Math.abs(clientX - startX);
          const canDragDown = startScrollTop <= 2 && deltaY > 0 && deltaY > deltaX;
          if (!canDragDown) return false;

          if (!dragging && deltaY > 8) {
            dragging = true;
            modal.scrollTop = 0;
          }

          if (!dragging) return false;

          modal.classList.add('dragging');
          modal.style.transform = `translateY(${Math.max(0, deltaY)}px)`;
          return true;
        };

        const endTracking = () => {
          if (!tracking) return;
          const delta = Math.max(0, currentY - startY);
          const shouldClose = dragging && delta > 64;
          tracking = false;
          dragging = false;
          modal.classList.remove('dragging');
          modal.style.transform = '';
          if (shouldClose) {
            closeModal(overlay.id);
          }
        };

        modal.addEventListener('pointerdown', (event) => {
          if (beginTracking(event.clientX, event.clientY, event.target, event.pointerId)) {
            modal.setPointerCapture(event.pointerId);
          }
        });

        modal.addEventListener('pointermove', (event) => {
          if (activePointerId !== null && event.pointerId !== activePointerId) return;
          if (updateDrag(event.clientX, event.clientY)) {
            event.preventDefault();
          }
        });

        const finishPointerDrag = (event) => {
          if (activePointerId !== null && event.pointerId !== activePointerId) return;
          if (modal.hasPointerCapture(event.pointerId)) {
            modal.releasePointerCapture(event.pointerId);
          }
          activePointerId = null;
          endTracking();
        };

        modal.addEventListener('pointerup', finishPointerDrag);
        modal.addEventListener('pointercancel', finishPointerDrag);

        modal.addEventListener('touchstart', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          beginTracking(touch.clientX, touch.clientY, event.target);
        }, { passive: true });

        modal.addEventListener('touchmove', (event) => {
          if (event.touches.length !== 1) return;
          const touch = event.touches[0];
          if (updateDrag(touch.clientX, touch.clientY)) {
            event.preventDefault();
          }
        }, { passive: false });

        modal.addEventListener('touchend', endTracking);
        modal.addEventListener('touchcancel', endTracking);
      });
    }

    function setupKeyboardAvoidance() {
      const updateKeyboardInset = () => {
        if (!window.visualViewport) return;
        const inset = Math.max(0, window.innerHeight - window.visualViewport.height - window.visualViewport.offsetTop);
        document.documentElement.style.setProperty('--keyboard-inset', `${Math.round(inset)}px`);
      };

      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', updateKeyboardInset);
        window.visualViewport.addEventListener('scroll', updateKeyboardInset);
      }

      document.addEventListener('focusin', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        if (!target.closest('.modal')) return;

        setTimeout(() => {
          updateKeyboardInset();
          target.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }, 120);
      });
    }
