    function saveTransaction() {
      const wasEditing = Boolean(state.editingTransactionId);
      const amount = parseFormattedNumber(document.getElementById('amountInput').value);
      const date = document.getElementById('dateInput').value;
      const memo = document.getElementById('memoInput').value;
      const shouldRepeat = document.getElementById('recurringInput').checked;
      const repeatCount = parseInt(document.getElementById('recurringCountInput').value, 10) || 1;

      if (!amount || amount <= 0) {
        showToast('금액을 입력해 주세요.');
        return;
      }

      if (!state.selectedUser) {
        showToast('사용자를 선택해 주세요.');
        return;
      }

      if (!state.selectedCategory) {
        showToast('카테고리를 선택해 주세요.');
        return;
      }

      if (!state.selectedPaymentMethod) {
        showToast('결제수단을 선택해 주세요.');
        return;
      }

      if (!state.selectedAsset) {
        showToast('자산을 선택해 주세요.');
        return;
      }

      if (!date) {
        showToast('날짜를 선택해 주세요.');
        return;
      }

      // 수정 모드인 경우
      if (state.editingTransactionId) {
        const transactionIndex = state.transactions.findIndex(t => t.id === state.editingTransactionId);
        if (transactionIndex !== -1) {
          state.transactions[transactionIndex] = {
            ...state.transactions[transactionIndex],
            type: state.selectedType,
            userId: state.selectedUser,
            amount: amount,
            categoryId: state.selectedCategory,
            paymentMethodId: state.selectedPaymentMethod,
            assetId: state.selectedAsset,
            transactionDate: date,
            memo: memo
          };
        }
        state.editingTransactionId = null;
        document.querySelector('#transactionModal .modal-title').textContent = '거래 추가';
      } else {
        // 새로운 거래 추가
        const transaction = {
          id: generateId(),
          type: state.selectedType,
          userId: state.selectedUser,
          amount: amount,
          categoryId: state.selectedCategory,
          paymentMethodId: state.selectedPaymentMethod,
          assetId: state.selectedAsset,
          transactionDate: date,
          memo: memo,
          createdAt: new Date().toISOString()
        };
        state.transactions.push(transaction);

        if (shouldRepeat) {
          for (let i = 1; i < repeatCount; i++) {
            state.transactions.push({
              ...transaction,
              id: generateId(),
              transactionDate: addMonthsClamped(date, i),
              recurringGroupId: transaction.id,
              createdAt: new Date().toISOString()
            });
          }
        }
      }

      state.uiPreferences.deviceUserId = state.selectedUser;
      state.uiPreferences.lastPaymentMethodId = state.selectedPaymentMethod;
      state.uiPreferences.lastAssetId = state.selectedAsset;
      saveUiPreferences();

      saveData();
      renderAll();
      showToast('삭제를 되돌렸어요.');
      closeModal('transactionModal');
      showToast(wasEditing ? '거래를 수정했어요.' : (shouldRepeat ? `${repeatCount}개월 반복 거래를 저장했어요.` : '거래를 저장했어요.'));
    }

    function saveTransfer() {
      const amount = parseFormattedNumber(document.getElementById('transferAmountInput').value);
      const date = document.getElementById('transferDateInput').value;

      if (!amount || amount <= 0) {
        showToast('금액을 입력해 주세요.');
        return;
      }

      if (!state.selectedFromAsset) {
        showToast('출발 자산을 선택해 주세요.');
        return;
      }

      if (!state.selectedToAsset) {
        showToast('도착 자산을 선택해 주세요.');
        return;
      }

      if (state.selectedFromAsset === state.selectedToAsset) {
        showToast('같은 자산으로는 이동할 수 없습니다.');
        return;
      }

      if (!date) {
        showToast('날짜를 선택해 주세요.');
        return;
      }

      const transaction = {
        id: generateId(),
        type: 'transfer',
        userId: getDeviceUser()?.id || state.users[0]?.id,
        amount: amount,
        assetId: state.selectedFromAsset,
        toAssetId: state.selectedToAsset,
        transactionDate: date,
        memo: '자산이동',
        createdAt: new Date().toISOString()
      };

      state.transactions.push(transaction);
      saveData();
      renderAll();
      closeModal('transferModal');
      showToast('자산이동을 저장했어요.');
    }

    function editTransaction(transactionId) {
      const transaction = state.transactions.find(t => t.id === transactionId);
      if (!transaction) return;

      // 거래 추가 모달을 열고 기존 값으로 채우기
      if (transaction.type === 'transfer') {
        alert('자산이동 거래는 수정할 수 없습니다.');
        return;
      }

      // 수정 모드 설정
      state.editingTransactionId = transactionId;

      // 기존 값 설정
      state.selectedUser = transaction.userId;
      state.selectedType = transaction.type;
      state.selectedCategory = transaction.categoryId;
      state.selectedPaymentMethod = transaction.paymentMethodId;
      state.selectedAsset = transaction.assetId;

      document.getElementById('amountInput').value = formatNumber(transaction.amount);
      document.getElementById('dateInput').value = transaction.transactionDate;
      document.getElementById('memoInput').value = transaction.memo || '';
      document.getElementById('recurringInput').checked = false;
      document.getElementById('recurringCountInput').value = '12';

      // UI 업데이트 - 사용자 선택 활성화
      renderSelectGrid('userSelect', state.users, state.selectedUser);

      // 유형 선택
      document.querySelectorAll('[data-type]').forEach(el => {
        el.classList.remove('selected');
        if (el.dataset.type === transaction.type) {
          el.classList.add('selected');
        }
      });

      renderSelectGrid('categorySelect', state.categories.filter(c => c.type === transaction.type), state.selectedCategory);
      renderSelectGrid('paymentMethodSelect', state.paymentMethods, state.selectedPaymentMethod);
      renderSelectGrid('assetSelect', state.assets, state.selectedAsset);

      // 모달 제목 변경
      document.querySelector('#transactionModal .modal-title').textContent = '거래 수정';

      // 모달 열기 및 스크롤 위치 초기화
      const modal = document.getElementById('transactionModal');
      modal.classList.add('active');
      const modalContent = modal.querySelector('.modal');
      if (modalContent) {
        modalContent.scrollTop = 0;
      }
      document.body.classList.add('modal-open');
    }

    function deleteTransaction(transactionId) {
      const index = state.transactions.findIndex(t => t.id === transactionId);
      if (index === -1) return;
      state.lastDeleted = {
        type: 'transactions',
        item: { ...state.transactions[index] },
        index
      };
      state.transactions.splice(index, 1);
      saveData();
      renderAll();
      showToast('거래를 삭제했어요. 설정에서 되돌릴 수 있어요.');
    }

    function openBudgetModal() {
      const { start, end } = getMonthRange(state.currentDate);
      let html = `
        <div class="settings-hint" style="margin-bottom: 14px;">
          자산별 월 예산을 입력하세요. 아래 금액 버튼으로 빠르게 조정할 수 있어요.
        </div>
      `;

      state.assets.forEach(asset => {
        const currentBudget = asset.budget || 0;
        const currentSpent = state.transactions
          .filter(transaction => {
            const transactionDate = new Date(transaction.transactionDate);
            return transaction.type === 'expense'
              && transaction.assetId === asset.id
              && transactionDate >= start
              && transactionDate <= end;
          })
          .reduce((sum, transaction) => sum + transaction.amount, 0);
        html += `
          <div class="form-group">
            <label class="form-label" for="budget-${escapeAttr(asset.id)}">${escapeHTML(asset.name)}</label>
            <div class="item-meta" style="margin-bottom: 7px;">${state.currentDate.getMonth() + 1}월 지출 ${formatMoney(currentSpent)}</div>
            <input type="text" inputmode="numeric" class="form-input" id="budget-${escapeAttr(asset.id)}" value="${currentBudget > 0 ? formatNumber(currentBudget) : ''}" placeholder="예산 입력">
            <div class="quick-amount-buttons" style="margin-top: 8px;">
              <button type="button" class="quick-amount-btn" data-budget-target="${escapeAttr(asset.id)}" data-budget-amount="50000">+5만</button>
              <button type="button" class="quick-amount-btn" data-budget-target="${escapeAttr(asset.id)}" data-budget-amount="100000">+10만</button>
              <button type="button" class="quick-amount-btn" data-budget-target="${escapeAttr(asset.id)}" data-budget-amount="500000">+50만</button>
              <button type="button" class="quick-amount-btn" data-budget-target="${escapeAttr(asset.id)}" data-budget-reset="true">0원</button>
            </div>
          </div>
        `;
      });

      html += '<button class="btn btn-primary" onclick="saveBudgets()">월 예산 저장</button>';

      document.getElementById('budgetFormContent').innerHTML = html;
      document.getElementById('budgetModal').classList.add('active');
      document.body.classList.add('modal-open');

      // 금액 포맷팅 이벤트 추가
      state.assets.forEach(asset => {
        const input = document.getElementById(`budget-${asset.id}`);
        input.addEventListener('input', (e) => {
          const formatted = formatNumber(e.target.value);
          e.target.value = formatted;
        });
      });

      document.querySelectorAll('[data-budget-target]').forEach(button => {
        button.addEventListener('click', () => {
          const input = document.getElementById(`budget-${button.dataset.budgetTarget}`);
          if (!input) return;
          if (button.dataset.budgetReset === 'true') {
            input.value = '';
          } else {
            input.value = formatNumber(parseFormattedNumber(input.value) + Number(button.dataset.budgetAmount || 0));
          }
          input.focus();
        });
      });
    }

    function saveBudgets() {
      state.assets.forEach(asset => {
        const input = document.getElementById(`budget-${asset.id}`);
        asset.budget = parseFormattedNumber(input.value);
      });

      saveData();
      renderAssetsList();
      closeModal('budgetModal');
      showToast('예산을 저장했어요.');
    }

    function toggleFavorite(type, id) {
      const items = state[type];
      const item = items.find(i => i.id === id);
      if (item) {
        item.isFavorite = !item.isFavorite;
        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }
      }
    }

    function editItem(type, id) {
      const items = state[type];
      const item = items.find(i => i.id === id);
      if (!item) return;

      const newName = prompt('새 이름을 입력하세요:', item.name);
      if (newName && newName.trim()) {
        item.name = newName.trim();
        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }

        renderAll();
      }
    }

    function moveItemUp(type, id) {
      const items = state[type];
      const sorted = [...items].sort((a, b) => {
        if (type === 'categories' && a.type !== b.type) {
          return a.type === 'income' ? -1 : 1;
        }
        return a.displayOrder - b.displayOrder;
      });

      const index = sorted.findIndex(i => i.id === id);
      if (index > 0) {
        const temp = sorted[index].displayOrder;
        sorted[index].displayOrder = sorted[index - 1].displayOrder;
        sorted[index - 1].displayOrder = temp;

        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }
      }
    }

    function moveItemDown(type, id) {
      const items = state[type];
      const sorted = [...items].sort((a, b) => {
        if (type === 'categories' && a.type !== b.type) {
          return a.type === 'income' ? -1 : 1;
        }
        return a.displayOrder - b.displayOrder;
      });

      const index = sorted.findIndex(i => i.id === id);
      if (index < sorted.length - 1) {
        const temp = sorted[index].displayOrder;
        sorted[index].displayOrder = sorted[index + 1].displayOrder;
        sorted[index + 1].displayOrder = temp;

        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }
      }
    }

    function deleteItem(type, id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;

      const items = state[type];
      const index = items.findIndex(i => i.id === id);
      if (index > -1) {
        const isUsed = state.transactions.some(t => {
          if (type === 'paymentMethods') return t.paymentMethodId === id;
          if (type === 'assets') return t.assetId === id || t.toAssetId === id;
          if (type === 'categories') return t.categoryId === id;
          return false;
        });

        if (isUsed) {
          showToast('기존 거래에서 사용 중이라 삭제할 수 없습니다. 이름을 수정해 보관해 주세요.');
          return;
        }

        state.lastDeleted = {
          type,
          item: { ...items[index] },
          index
        };
        items.splice(index, 1);
        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }

        renderAll();
        showToast('항목을 삭제했어요.');
      }
    }

    function addNewItem(type, categoryType = null) {
      const name = prompt('이름을 입력하세요:');
      if (!name || !name.trim()) return;

      const items = state[type];
      const maxOrder = Math.max(...items.map(i => i.displayOrder || 0), 0);

      const newItem = {
        id: generateId(),
        name: name.trim(),
        displayOrder: maxOrder + 1,
        isFavorite: true
      };

      if (type === 'categories') {
        newItem.type = categoryType;
        newItem.icon = '📁';
      }

      if (type === 'assets') {
        newItem.balance = 0;
        newItem.budget = 0;
      }

      items.push(newItem);
      saveData();

      if (type === 'paymentMethods') {
        renderPaymentMethodsSettings();
      } else if (type === 'assets') {
        renderAssetsSettings();
      } else if (type === 'categories') {
        renderCategoriesSettings();
      }

      renderAll();
    }

    async function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.getElementById(`${tabName}-content`).classList.add('active');

      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

      // body에 현재 활성 탭 설정 (헤더 표시/숨김 제어)
      document.body.setAttribute('data-active-tab', tabName);

      // 요소들
      const summaryElement = document.querySelector('.summary');
      const monthSelectorElement = document.querySelector('.month-selector');
      const headerAddBtn = document.getElementById('headerAddBtn');
      const userFilterElement = document.getElementById('userFilter');

      // 달력 탭
      if (tabName === 'calendar') {
        summaryElement.style.display = 'block';
        monthSelectorElement.style.display = 'flex';
        userFilterElement.style.display = 'flex';
        headerAddBtn.style.display = 'none';
        renderCalendar();
        renderSelectedDateTransactions(state.selectedDate);
      }
      // 내역, 예산 탭 - 월 선택기만 표시
      else if (tabName === 'log' || tabName === 'assets') {
        summaryElement.style.display = 'none';
        monthSelectorElement.style.display = 'flex';
        headerAddBtn.style.display = 'none';
        if (tabName === 'log') {
          userFilterElement.style.display = 'flex';
          renderTransactionList();
        } else {
          userFilterElement.style.display = 'none';
          renderAssetsList();
          if (state.activeReportPane === 'stats') requestAnimationFrame(renderStats);
        }
      }
      // 설정 탭
      else {
        summaryElement.style.display = 'none';
        monthSelectorElement.style.display = 'none';
        userFilterElement.style.display = 'none';
        headerAddBtn.style.display = 'none';
        renderUiPreferencesSettings();
      }
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    function switchReportPane(paneName) {
      state.activeReportPane = paneName;
      document.querySelectorAll('.report-pane').forEach(pane => pane.classList.toggle('active', pane.id === `report-${paneName}-pane`));
      document.querySelectorAll('.report-switch-btn').forEach(button => {
        const active = button.dataset.reportPane === paneName;
        button.classList.toggle('active', active);
        button.setAttribute('aria-selected', String(active));
      });
      if (paneName === 'stats') requestAnimationFrame(renderStats);
    }

    function renderAll() {
      updateMonthDisplay();
      updateSummary();
      renderQuickEntryPanel();
      renderCalendar();
      renderSelectedDateTransactions(state.selectedDate);
      renderTransactionList();
      renderAssetsList();
      renderStats();
      renderUiPreferencesSettings();
      renderPaymentMethodsSettings();
      renderAssetsSettings();
      renderCategoriesSettings();
      updateSyncStatus();
    }

    // ============================================
    // 초기화
    // ============================================
    document.addEventListener('DOMContentLoaded', async () => {
      loadUiPreferences();
      loadData();
      renderAll();
      setupBottomSheetDismissal();
      setupKeyboardAvoidance();

      // Cloudflare D1 연결. 실패해도 먼저 읽은 로컬 사본은 그대로 유지합니다.
      await loadFromCloud();
      if (!state.users.some(user => user.id === state.uiPreferences.deviceUserId)) {
        state.uiPreferences.deviceUserId = state.users[0]?.id || null;
        saveUiPreferences();
      }
      renderAll();

      // 앱으로 돌아왔을 때 다른 기기에서 저장한 내용을 새로 확인합니다.
      window.addEventListener('focus', async () => {
        if (state.cloudAvailable && state.pendingSyncCount === 0) {
          await loadFromCloud();
          renderAll();
        }
      });

      // 월 변경
      document.getElementById('prevMonth').addEventListener('click', () => {
        setCurrentMonth(new Date(state.currentDate.getFullYear(), state.currentDate.getMonth() - 1, 1));
      });

      document.getElementById('nextMonth').addEventListener('click', () => {
        setCurrentMonth(new Date(state.currentDate.getFullYear(), state.currentDate.getMonth() + 1, 1));
      });

      document.getElementById('todayButton').addEventListener('click', () => setCurrentMonth(new Date()));

      // 사용자 필터
      document.querySelectorAll('.user-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const selectedUser = btn.dataset.user;

          // 토글 기능: 이미 선택된 버튼을 다시 클릭하면 전체로 변경
          if (btn.classList.contains('active') && selectedUser !== 'all') {
            document.querySelectorAll('.user-filter-btn').forEach(b => b.classList.remove('active'));
            const allBtn = document.querySelector('.user-filter-btn[data-user="all"]');
            if (allBtn) allBtn.classList.add('active');
            state.calendarUserFilter = 'all';
          } else {
            document.querySelectorAll('.user-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            state.calendarUserFilter = selectedUser;
          }

          updateSummary();
          renderCalendar();
          renderSelectedDateTransactions(state.selectedDate);
          renderTransactionList();
          renderAssetsList();
        });
      });

      // 탭 전환
      document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', () => {
          const tab = item.dataset.tab;
          switchTab(tab);
        });
      });

      document.querySelectorAll('.report-switch-btn').forEach(button => {
        button.addEventListener('click', () => switchReportPane(button.dataset.reportPane));
      });

      document.getElementById('deviceUserSettings').addEventListener('click', (event) => {
        const button = event.target.closest('[data-device-user]');
        if (!button) return;
        state.uiPreferences.deviceUserId = button.dataset.deviceUser;
        saveUiPreferences();
        renderQuickEntryPanel();
        showToast(`${state.users.find(user => user.id === button.dataset.deviceUser)?.name || '선택한 사용자'}으로 입력할게요.`);
      });

      document.getElementById('calendarAmountModeSettings').addEventListener('click', (event) => {
        const button = event.target.closest('[data-calendar-mode]');
        if (!button) return;
        state.uiPreferences.calendarAmountMode = button.dataset.calendarMode;
        saveUiPreferences();
        renderCalendar();
        showToast('달력 금액 표시를 변경했어요.');
      });

      document.getElementById('logoutDeviceBtn').addEventListener('click', async () => {
        if (!confirm('이 기기의 인증을 해제할까요? 가계부 데이터는 삭제되지 않습니다.')) return;
        await fetch('/api/auth/logout', { method: 'POST' });
        location.replace('/login.html');
      });

      // 거래 추가 버튼
      document.getElementById('addTransactionBtn').addEventListener('click', openTransactionModal);
      document.getElementById('headerAddBtn').addEventListener('click', openTransactionModal);

      // 거래 타입 선택
      document.querySelectorAll('[data-type]').forEach(item => {
        item.addEventListener('click', () => {
          document.querySelectorAll('[data-type]').forEach(i => i.classList.remove('selected'));
          item.classList.add('selected');
          state.selectedType = item.dataset.type;
          updateTransactionModalForType();
        });
      });

      // 금액 입력 포맷팅
      document.getElementById('amountInput').addEventListener('input', (e) => {
        const formatted = formatNumber(e.target.value);
        e.target.value = formatted;
      });

      document.getElementById('transferAmountInput').addEventListener('input', (e) => {
        const formatted = formatNumber(e.target.value);
        e.target.value = formatted;
      });

      // 금액 초기화
      document.getElementById('resetAmountBtn').addEventListener('click', () => {
        document.getElementById('amountInput').value = '';
      });

      document.getElementById('resetTransferAmountBtn').addEventListener('click', () => {
        document.getElementById('transferAmountInput').value = '';
      });

      // 빠른 금액 추가
      document.querySelectorAll('.quick-amount-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const amount = parseInt(btn.dataset.amount);
          const target = btn.dataset.target;

          let input;
          if (target === 'transfer') {
            input = document.getElementById('transferAmountInput');
          } else {
            input = document.getElementById('amountInput');
          }

          const currentAmount = parseFormattedNumber(input.value);
          const newAmount = currentAmount + amount;
          input.value = formatNumber(newAmount);
        });

          renderTransactionList();

          renderStats();

      });

      // 동기화
      document.getElementById('syncData').addEventListener('click', async () => {
        const button = document.getElementById('syncData');
        const originalText = button.innerHTML;

        try {
          button.disabled = true;
          button.innerHTML = '<span>🔄</span><span>동기화 중...</span>';
          button.style.opacity = '0.6';

          if (!state.cloudAvailable) await loadFromCloud();
          if (!state.cloudAvailable) throw new Error('클라우드에 연결할 수 없습니다.');
          const saved = await saveToCloud();
          if (!saved) throw new Error('로컬 데이터는 보존했지만 클라우드 저장에 실패했습니다.');
          await loadFromCloud();
          renderAll();

          // 성공 피드백
          button.innerHTML = '<span>✓</span><span>동기화 완료!</span>';
          button.style.background = 'var(--success)';

          setTimeout(() => {
            button.innerHTML = originalText;
            button.style.background = '';
            button.style.opacity = '';
            button.disabled = false;
          }, 2000);
        } catch (error) {
          // 실패 피드백
          button.innerHTML = '<span>✕</span><span>동기화 실패</span>';
          button.style.background = 'var(--danger)';

          setTimeout(() => {
            button.innerHTML = originalText;
            button.style.background = '';
            button.style.opacity = '';
            button.disabled = false;
          }, 2000);

          console.error('동기화 오류:', error);
        }
      });

      // 결제수단/자산/카테고리 추가
      document.getElementById('addPaymentMethod').addEventListener('click', () => addNewItem('paymentMethods'));
      document.getElementById('addAsset').addEventListener('click', () => addNewItem('assets'));
      document.getElementById('addCategory').addEventListener('click', () => {
        const type = confirm('수입 카테고리입니까? (취소하면 지출)') ? 'income' : 'expense';
        addNewItem('categories', type);
      });

      // 모달 오버레이 클릭 시 닫기
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            closeModal(overlay.id);
          }
        });
      });
    });

    // Service Worker 등록 (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
