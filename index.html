<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="생활 가계부">
  <link rel="manifest" href="manifest.json">
  <!-- System font only -->
  <title>생활 가계부</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }

    :root {
      --primary: #6C5DD3;
      --primary-dark: #5847C4;
      --primary-light: #8F7EEB;
      --success: #00C9A7;
      --danger: #FF6B6B;
      --warning: #FFB84D;
      --gray-50: #F3F4F6;
      --gray-100: #E8EBF0;
      --gray-200: #E5E7EB;
      --gray-300: #D1D5DB;
      --gray-400: #9CA3AF;
      --gray-500: #6B7280;
      --gray-600: #4B5563;
      --gray-700: #374151;
      --gray-800: #1F2937;
      --gray-900: #111827;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px -1px rgba(0, 0, 0, 0.1);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #FAFAFA;
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
      color: var(--gray-900);
      line-height: 1.5;
    }

    body.modal-open {
      overflow: hidden;
      touch-action: none;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #FAFAFA;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(70px + env(safe-area-inset-bottom));
    }

    /* 헤더 */
    .header {
      background: white;
      padding: max(16px, env(safe-area-inset-top)) 16px 8px;
      box-shadow: none;
      border-bottom: 1px solid #f0f0f0;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-add-btn {
      background: transparent;
      border: none;
      font-size: 24px;
      font-weight: 300;
      color: #333;
      cursor: pointer;
      padding: 4px 8px;
      line-height: 1;
    }

    /* 통계, 설정 탭일 때 헤더 숨기기 */
    body[data-active-tab="stats"] .header,
    body[data-active-tab="settings"] .header {
      display: none;
    }

    /* 달력, 내역, 예산 탭일 때 FAB 숨기기 */
    body[data-active-tab="calendar"] .fab,
    body[data-active-tab="log"] .fab,
    body[data-active-tab="assets"] .fab {
      display: none;
    }

    /* 탭 제목 */
    .tab-title {
      background: transparent;
      padding: max(20px, env(safe-area-inset-top)) 16px 12px;
      box-shadow: none;
    }

    .tab-title h2 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin: 0;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      color: white;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
    }

    .month-selector {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }

    .month-selector button {
      background: transparent;
      border: none;
      color: #999;
      padding: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .month-selector button:hover {
      background: #f5f5f5;
    }

    .month-selector button:active {
      background: #eee;
      transform: scale(0.95);
    }

    .month-selector span {
      font-size: 15px;
      font-weight: 600;
      color: #333;
    }

    /* 사용자 필터 */
    .user-filter {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .user-filter-btn {
      background: transparent;
      border: 1px solid #ddd;
      color: #666;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 12px;
      transition: all 0.2s;
    }

    .user-filter-btn:active {
      transform: scale(0.95);
    }

    .user-filter-btn.active {
      background: #333;
      color: white;
      border-color: #333;
    }

    /* 요약 카드 */
    .summary {
      background: white;
      margin: 0;
      padding: 8px 16px;
      box-shadow: none;
      border-bottom: 1px solid #f0f0f0;
    }

    .summary-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 24px;
    }

    .summary-item {
      text-align: left;
      padding: 2px 0;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .summary-item.balance-item {
      margin-left: auto;
    }

    .summary-label {
      color: #888;
      font-size: 11px;
      font-weight: 500;
      margin-bottom: 0;
    }

    .summary-value {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .summary-value.income {
      color: #4A90D9;
    }

    .summary-value.expense {
      color: #E74C3C;
    }

    .summary-value.balance {
      color: #E74C3C;
    }

    /* 콘텐츠 영역 */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    /* 달력 탭일 때 content의 overflow 숨김 */
    body[data-active-tab="calendar"] .content {
      overflow: hidden !important;
      overflow-y: hidden !important;
      display: flex;
      flex-direction: column;
    }

    /* 달력 탭 제외한 탭들의 패딩 */
    #log-content,
    #assets-content,
    #stats-content,
    #settings-content {
      padding: 16px;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* 달력 탭 레이아웃 - 달력 고정, 거래내역만 스크롤 */
    #calendar-content.active {
      display: flex !important;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* 카드 공통 스타일 */
    .card {
      background: white;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 8px;
      box-shadow: none;
      transition: background 0.15s;
      border: 1px solid #f0f0f0;
    }

    .card:hover {
      background: #fafafa;
    }

    /* 달력 */
    .calendar {
      background: white;
      border-radius: 0;
      padding: 8px 4px;
      margin-bottom: 0;
      box-shadow: none;
      overflow: hidden;
      flex-shrink: 0; /* 달력 고정 */
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0;
      max-width: 100%;
    }

    .calendar-day-header {
      text-align: center;
      padding: 6px 0;
      font-size: 10px;
      color: #aaa;
      font-weight: 500;
    }

    .calendar-day-header.sun {
      color: #E74C3C;
    }

    .calendar-day-header.sat {
      color: #7B8BD9;
    }

    .calendar-day {
      aspect-ratio: 0.85;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 6px;
      cursor: pointer;
      transition: background 0.15s ease;
      position: relative;
      background: transparent;
      min-height: 0;
    }

    .calendar-day:hover {
      background: #f8f8f8;
    }

    .calendar-day:active {
      background: #f0f0f0;
    }

    .calendar-day.other-month {
      opacity: 0.25;
    }

    .calendar-day.today {
      background: transparent;
    }

    .calendar-day.today .calendar-day-number {
      background: #c0c0c0;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 다른 날짜가 선택되었을 때 오늘 날짜를 연하게 */
    body[data-has-selected="true"] .calendar-day.today:not(.selected) .calendar-day-number {
      opacity: 0.5;
    }

    .calendar-day.selected {
      background: #d5d5d5;
      border-radius: 8px;
    }

    /* 선택된 날짜에는 작은 원 제거 */
    .calendar-day.selected .calendar-day-number {
      background: transparent;
      border-radius: 0;
    }

    .calendar-day-number {
      font-size: 13px;
      font-weight: 500;
      color: #333;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .calendar-day.sun .calendar-day-number {
      color: #E74C3C;
    }

    .calendar-day.sat .calendar-day-number {
      color: #7B8BD9;
    }

    .calendar-day-amounts {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      margin-top: 1px;
      width: 100%;
      padding: 0 1px;
    }

    .calendar-day-amount {
      font-size: 9px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      text-align: center;
      line-height: 1.2;
    }

    .calendar-day-amount.income {
      color: #4A90D9;
    }

    .calendar-day-amount.expense {
      color: #E74C3C;
    }

    /* 금액이 클 경우 더 작은 폰트 */
    .calendar-day-amount.small-font {
      font-size: 8px;
    }

    .calendar-day-amount.tiny-font {
      font-size: 7px;
    }

    /* 기존 dots 스타일 - 사용하지 않지만 호환성 유지 */
    .calendar-day-dots {
      display: none;
    }

    .calendar-day-dot {
      display: none;
    }

    /* 달력 하단 선택된 날짜의 거래 내역 */
    .calendar-selected-transactions {
      background: white;
      border-radius: 0;
      padding: 12px 16px;
      margin-bottom: 0;
      margin-top: 1px;
      box-shadow: none;
      border-top: 1px solid #f0f0f0;
      min-height: 80px;
      flex: 1; /* 남은 공간 차지 */
      overflow-y: auto; /* 세로 스크롤 활성화 */
      display: flex;
      flex-direction: column;
    }

    .calendar-selected-date {
      font-size: 12px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }

    .calendar-transaction-list {
      flex: 1; /* 부모 컨테이너 내에서 확장 */
    }

    .calendar-transaction-card {
      background: white;
      border-radius: 4px;
      padding: 0;
      box-shadow: none;
      border: 1px solid #f0f0f0;
    }

    .calendar-transaction-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
      transition: background 0.15s;
    }

    .calendar-transaction-row:hover {
      background: #fafafa;
    }

    .calendar-transaction-row:last-child {
      border-bottom: none;
    }

    .calendar-transaction-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .calendar-transaction-main {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .transaction-memo {
      font-size: 11px;
      color: #888;
    }

    /* 거래 내역 리스트 */
    .transaction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 날짜별 그룹 카드 */
    .date-group-card {
      background: white;
      border-radius: 4px;
      border: 1px solid #f0f0f0;
      overflow: hidden;
    }

    .date-group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: #fafafa;
      border-bottom: 1px solid #f0f0f0;
    }

    .date-group-date {
      font-size: 12px;
      font-weight: 600;
      color: #333;
    }

    .date-group-summary {
      display: flex;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
    }

    .date-group-summary .income {
      color: #4A90D9;
    }

    .date-group-summary .expense {
      color: #E74C3C;
    }

    .date-group-items {
      display: flex;
      flex-direction: column;
    }

    .date-group-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid #f5f5f5;
      cursor: pointer;
      transition: background 0.15s;
    }

    .date-group-item:last-child {
      border-bottom: none;
    }

    .date-group-item:hover {
      background: #fafafa;
    }

    .date-group-item-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      overflow: hidden;
    }

    .transaction-memo-inline {
      font-size: 11px;
      color: #888;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .transaction-item {
      background: white;
      border-radius: 4px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
      box-shadow: none;
      border: 1px solid #f0f0f0;
    }

    .transaction-item:hover {
      background: #fafafa;
    }

    .transaction-item:active {
      background: #f5f5f5;
    }

    .transaction-left {
      flex: 1;
    }

    .transaction-date-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      background: #f5f5f5;
      color: #666;
      padding: 2px 6px;
      border-radius: 2px;
      margin-right: 6px;
    }

    .transaction-user {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      background: #f5f5f5;
      color: #555;
      padding: 2px 6px;
      border-radius: 2px;
      margin-right: 6px;
    }

    .transaction-category {
      font-size: 13px;
      font-weight: 500;
      color: #333;
      letter-spacing: -0.3px;
      margin-top: 4px;
    }

    /* 카테고리 아이콘 */
    .category-icon {
      display: inline-block;
      margin-right: 4px;
    }

    .transaction-method {
      font-size: 11px;
      color: #888;
      margin-top: 2px;
      font-weight: 400;
    }

    .transaction-amount {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .transaction-amount.income {
      color: #4A90D9;
    }

    .transaction-amount.expense {
      color: #E74C3C;
    }

    .transaction-amount.transfer {
      color: #888;
    }

    /* 예산 요약 카드 */
    .budget-summary-card {
      background: white;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #f0f0f0;
    }

    .budget-summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .budget-month {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .budget-status {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 3px;
    }

    .budget-status.good {
      background: #E8F5E9;
      color: #2E7D32;
    }

    .budget-status.warning {
      background: #FFF3E0;
      color: #E65100;
    }

    .budget-status.bad {
      background: #FFEBEE;
      color: #C62828;
    }

    .budget-summary-amounts {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .budget-summary-item {
      text-align: center;
    }

    .budget-summary-label {
      font-size: 10px;
      color: #888;
      margin-bottom: 2px;
    }

    .budget-summary-value {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .budget-summary-value.expense {
      color: #E74C3C;
    }

    .budget-progress-bar {
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: visible;
      margin-bottom: 8px;
      position: relative;
    }

    .budget-progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.3s ease;
    }

    .budget-progress-fill.good {
      background: #4CAF50;
    }

    .budget-progress-fill.warning {
      background: #FF9800;
    }

    .budget-progress-fill.bad {
      background: #E74C3C;
    }

    .budget-progress-marker {
      position: absolute;
      top: -3px;
      width: 2px;
      height: 12px;
      background: #333;
      border-radius: 1px;
    }

    .budget-summary-desc {
      font-size: 11px;
      color: #888;
      text-align: center;
      margin-bottom: 4px;
    }

    .budget-days-info {
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #aaa;
    }

    /* 자산 카드 */
    .asset-card {
      background: white;
      border-radius: 4px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: none;
      border: 1px solid #f0f0f0;
      cursor: pointer;
      transition: background 0.15s;
    }

    .asset-card:hover {
      background: #fafafa;
    }

    .asset-card:active {
      background: #f5f5f5;
    }

    .asset-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .asset-name {
      font-size: 13px;
      font-weight: 600;
      color: #333;
    }

    .asset-budget-remaining {
      font-size: 14px;
      font-weight: 600;
      color: #4CAF50;
    }

    .asset-budget-remaining.expense {
      color: #E74C3C;
    }

    .asset-budget-bar {
      height: 4px;
      background: #f0f0f0;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .budget-progress {
      height: 100%;
      border-radius: 2px;
      transition: width 0.3s ease;
    }

    .budget-progress.good {
      background: #4CAF50;
    }

    .budget-progress.warning {
      background: #FF9800;
    }

    .budget-progress.bad {
      background: #E74C3C;
    }

    .asset-budget-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      font-weight: 400;
    }

    .no-budget {
      color: #ccc;
    }

    /* 차트 */
    .chart {
      background: white;
      border-radius: 4px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #e0e0e0;
    }

    .chart-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 16px;
      color: #333;
    }

    .chart-canvas {
      width: 100%;
      height: 250px !important;
      max-height: 250px !important;
    }

    .bar-chart {
      margin-bottom: 0;
    }

    .bar-item {
      margin-bottom: 14px;
    }

    .bar-item:last-child {
      margin-bottom: 0;
    }

    .bar-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .bar-label span:first-child {
      font-weight: 500;
      color: #555;
    }

    .bar-label span:last-child {
      font-weight: 600;
      color: #333;
    }

    .bar-bg {
      height: 6px;
      background: #f0f0f0;
      border-radius: 3px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: #333;
      border-radius: 3px;
      transition: width 0.2s ease;
    }

    .bar-fill.warning {
      background: #e6a23c;
    }

    .bar-fill.danger {
      background: #E74C3C;
    }

    /* 검색바 */
    .search-bar {
      margin-bottom: 16px;
    }

    .search-input {
      width: 100%;
      padding: 14px 18px;
      border: 2px solid var(--gray-100);
      border-radius: 14px;
      font-size: 14px;
      background: white;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;

  <!-- 거래 상세 모달 -->

    <div class="modal">

  <script>
    // ============================================
    // 전역 상태
    // ============================================
    let state = {
      currentDate: new Date(),
      selectedDate: formatDate(new Date()),
      selectedUser: null,
      selectedType: 'expense',
      selectedCategory: null,
      selectedPaymentMethod: null,
      selectedAsset: null,
      selectedFromAsset: null,
      selectedToAsset: null,
      logFilter: 'all',
      calendarUserFilter: 'all',
      editingTransactionId: null,

      users: [
        { id: '1', name: '국환' },
        { id: '2', name: '혜지' }
      ],

      paymentMethods: [
        { id: '1', name: '현금', displayOrder: 1, isFavorite: true },
        { id: '2', name: '체크카드', displayOrder: 2, isFavorite: true },
        { id: '3', name: '신용카드1', displayOrder: 3, isFavorite: true },
        { id: '4', name: '신용카드2', displayOrder: 4, isFavorite: true }
      ],

      assets: [
        { id: '1', name: '입출금 통장', balance: 0, displayOrder: 1, isFavorite: true, budget: 0 },
        { id: '2', name: '자동차 통장', balance: 0, displayOrder: 2, isFavorite: true, budget: 0 },
        { id: '3', name: '생활비 통장', balance: 0, displayOrder: 3, isFavorite: true, budget: 0 }
      ],

      categories: [
        { id: '1', name: '급여', icon: '💰', type: 'income', displayOrder: 1, isFavorite: true },
        { id: '2', name: '부수입', icon: '💵', type: 'income', displayOrder: 2, isFavorite: true },
        { id: '3', name: '식비', icon: '🍚', type: 'expense', displayOrder: 1, isFavorite: true },
        { id: '4', name: '카페', icon: '☕', type: 'expense', displayOrder: 2, isFavorite: true },
        { id: '5', name: '교통', icon: '🚌', type: 'expense', displayOrder: 3, isFavorite: true },
        { id: '6', name: '쇼핑', icon: '🛒', type: 'expense', displayOrder: 4, isFavorite: true },
        { id: '7', name: '생활', icon: '🏠', type: 'expense', displayOrder: 5, isFavorite: false },
        { id: '8', name: '취미', icon: '🎮', type: 'expense', displayOrder: 6, isFavorite: false },
        { id: '9', name: '의료', icon: '🏥', type: 'expense', displayOrder: 7, isFavorite: false },
        { id: '10', name: '경조사', icon: '🎁', type: 'expense', displayOrder: 8, isFavorite: false },
        { id: '11', name: '미용', icon: '💇', type: 'expense', displayOrder: 9, isFavorite: false },
        { id: '12', name: '기타', icon: '📦', type: 'expense', displayOrder: 10, isFavorite: false }
      ],

      transactions: [],
      statsFilter: 'month',
      searchQuery: '',
      expandedSections: {
        category: false,
        paymentMethod: false
      },

      useLocalStorage: true,
      supabaseClient: null,
      trendChart: null
    };

    // ============================================
    // 유틸리티 함수
    // ============================================
    function formatNumber(num) {
      const numStr = String(num).replace(/[^\d]/g, '');
      if (!numStr) return '';
      return new Intl.NumberFormat('ko-KR').format(parseInt(numStr));
    }

    function parseFormattedNumber(str) {
      return parseInt(String(str).replace(/[^\d]/g, '')) || 0;
    }

    function formatAmount(amount) {
      return new Intl.NumberFormat('ko-KR').format(amount) + '원';
    }

    function formatMoney(amount) {
      return new Intl.NumberFormat('ko-KR').format(amount) + '원';
    }

    function formatDate(date) {
      const d = new Date(date);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function formatDateKo(date) {
      const d = new Date(date);
      const days = ['일', '월', '화', '수', '목', '금', '토'];
      return `${d.getMonth() + 1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
    }

    function getMonthRange(date) {
      const start = new Date(date.getFullYear(), date.getMonth(), 1);
      start.setHours(0, 0, 0, 0);
      const end = new Date(date.getFullYear(), date.getMonth() + 1, 0);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function getWeekRange(date) {
      const start = new Date(date);
      start.setDate(date.getDate() - date.getDay());
      start.setHours(0, 0, 0, 0);
      const end = new Date(start);
      end.setDate(start.getDate() + 6);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function getYearRange(date) {
      const start = new Date(date.getFullYear(), 0, 1);
      start.setHours(0, 0, 0, 0);
      const end = new Date(date.getFullYear(), 11, 31);
      end.setHours(23, 59, 59, 999);
      return { start, end };
    }

    function getStatsPeriodRange() {
      if (state.statsFilter === 'week') {
        // 주간은 오늘 기준으로 현재 주
        return getWeekRange(new Date());
      } else if (state.statsFilter === 'year') {
        return getYearRange(state.currentDate);
      } else {
        return getMonthRange(state.currentDate);
      }
    }

    function generateId() {
      return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function debounce(func, wait) {
      let timeout;
      return function executedFunction(...args) {
        const later = () => {
          clearTimeout(timeout);
          func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
      };
    }

    // ============================================
    // 데이터 저장/로드
    // ============================================
    function saveLocalData() {
      localStorage.setItem('household_data', JSON.stringify({
        users: state.users,
        paymentMethods: state.paymentMethods,
        assets: state.assets,
        categories: state.categories,
        transactions: state.transactions
      }));
    }

    async function saveToSupabase() {
      if (!state.supabaseClient) return;

      try {
        const data = {
          users: state.users,
          payment_methods: state.paymentMethods,
          assets: state.assets,
          categories: state.categories,
          transactions: state.transactions,
          monthly_budget: state.monthlyBudget,
          category_budgets: state.categoryBudgets,
          updated_at: new Date().toISOString()
        };

        const { data: existing, error: selectError } = await state.supabaseClient
          .from('household_data')
          .select('id')
          .limit(1);

        if (selectError) {
          console.error('Supabase 조회 실패:', selectError);
          return;
        }

        if (existing && existing.length > 0) {
          const { error: updateError } = await state.supabaseClient
            .from('household_data')
            .update(data)
            .eq('id', existing[0].id);

          if (updateError) {
            console.error('Supabase 업데이트 실패:', updateError);
          } else {
            console.log('✅ Supabase 자동 저장 완료');
          }
        } else {
          const { error: insertError } = await state.supabaseClient
            .from('household_data')
            .insert([data]);

          if (insertError) {
            console.error('Supabase 삽입 실패:', insertError);
          } else {
            console.log('✅ Supabase 자동 저장 완료');
          }
        }
      } catch (error) {
        console.error('Supabase 저장 실패:', error);
      }
    }

    const debouncedSyncToSupabase = debounce(saveToSupabase, 5000);

    function saveData() {
      saveLocalData();
      if (!state.useLocalStorage && state.supabaseClient) {
        debouncedSyncToSupabase();
      }
    }

    function loadLocalData() {
      const saved = localStorage.getItem('household_data');
      if (saved) {
        const data = JSON.parse(saved);
        state.users = data.users || state.users;
        state.paymentMethods = data.paymentMethods || state.paymentMethods;
        state.assets = data.assets || state.assets;
        state.categories = data.categories || state.categories;
        state.transactions = data.transactions || [];
      }
    }

    async function loadFromSupabase() {
      if (!state.supabaseClient) return;

      try {
        const { data, error } = await state.supabaseClient
          .from('household_data')
          .select('*')
          .order('updated_at', { ascending: false })
          .limit(1);

        if (error) {
          console.error('Supabase 로드 실패:', error);
          return;
        }

        if (data && data.length > 0) {
          const loadedData = data[0];
          state.users = loadedData.users || state.users;
          state.paymentMethods = loadedData.payment_methods || state.paymentMethods;
          state.assets = loadedData.assets || state.assets;
          state.categories = loadedData.categories || state.categories;
          state.transactions = loadedData.transactions || [];
          state.monthlyBudget = loadedData.monthly_budget || 0;
          state.categoryBudgets = loadedData.category_budgets || {};

          saveLocalData();
          console.log('✅ Supabase 데이터 로드 완료');
        }
      } catch (error) {
        console.error('Supabase 로드 실패:', error);
      }
    }

    async function loadData() {
      loadLocalData();
      if (!state.useLocalStorage && state.supabaseClient) {
        await loadFromSupabase();
      }
    }

    // ============================================
    // 렌더링 함수
    // ============================================
    function updateMonthDisplay() {
      const month = state.currentDate.getMonth() + 1;
      document.getElementById('currentMonth').textContent = `${month}월`;
    }

    function updateSummary() {
      const { start, end } = getMonthRange(state.currentDate);
      let monthTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end;
      });

      // 사용자 필터 적용
      if (state.calendarUserFilter !== 'all') {
        monthTransactions = monthTransactions.filter(t => t.userId === state.calendarUserFilter);
      }

      const income = monthTransactions
        .filter(t => t.type === 'income')
        .reduce((sum, t) => sum + t.amount, 0);

      const expense = monthTransactions
        .filter(t => t.type === 'expense')
        .reduce((sum, t) => sum + t.amount, 0);

      const balance = income - expense;

      document.getElementById('totalIncome').textContent = '+' + formatMoney(income);
      document.getElementById('totalExpense').textContent = '-' + formatMoney(expense);
      document.getElementById('totalBalance').textContent = (balance >= 0 ? '+' : '') + formatMoney(balance);
    }

    // 금액을 포맷팅 (달력용) - 전체 숫자 표시, 길이에 따라 폰트 크기 조정
    function formatCalendarAmount(amount) {
      const text = amount.toLocaleString();
      const len = text.length;

      if (len >= 9) {
        return { text, fontClass: 'tiny-font' };
      } else if (len >= 7) {
        return { text, fontClass: 'small-font' };
      } else {
        return { text, fontClass: '' };
      }
    }

    function renderCalendar() {
      const year = state.currentDate.getFullYear();
      const month = state.currentDate.getMonth();

      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      const startDay = new Date(firstDay);
      startDay.setDate(startDay.getDate() - firstDay.getDay());

      const endDay = new Date(lastDay);
      endDay.setDate(endDay.getDate() + (6 - lastDay.getDay()));

      let html = '';

      const dayHeaders = ['일', '월', '화', '수', '목', '금', '토'];
      dayHeaders.forEach((day, index) => {
        let className = 'calendar-day-header';
        if (index === 0) className += ' sun';
        if (index === 6) className += ' sat';
        html += `<div class="${className}">${day}</div>`;
      });

      const current = new Date(startDay);
      const todayStr = formatDate(new Date());

      while (current <= endDay) {
        const dateStr = formatDate(current);
        const isCurrentMonth = current.getMonth() === month;
        const isToday = todayStr === dateStr;
        const isSelected = state.selectedDate === dateStr;
        const dayOfWeek = current.getDay();

        let dayTransactions = state.transactions.filter(t => t.transactionDate === dateStr);

        // 사용자 필터 적용
        if (state.calendarUserFilter !== 'all') {
          dayTransactions = dayTransactions.filter(t => t.userId === state.calendarUserFilter);
        }

        const income = dayTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
        const expense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

        let className = 'calendar-day';
        if (!isCurrentMonth) className += ' other-month';
        if (isToday) className += ' today';
        if (isSelected) className += ' selected';
        if (dayOfWeek === 0) className += ' sun';
        if (dayOfWeek === 6) className += ' sat';

        const incomeFormatted = income > 0 ? formatCalendarAmount(income) : null;
        const expenseFormatted = expense > 0 ? formatCalendarAmount(expense) : null;

        html += `
          <div class="${className}" onclick="onCalendarDayClick('${dateStr}')" ondblclick="onCalendarDayDoubleClick('${dateStr}')">
            <div class="calendar-day-number">${current.getDate()}</div>
            ${(income > 0 || expense > 0) ? `
              <div class="calendar-day-amounts">
                ${income > 0 ? `<div class="calendar-day-amount income ${incomeFormatted.fontClass}">+${incomeFormatted.text}</div>` : ''}
                ${expense > 0 ? `<div class="calendar-day-amount expense ${expenseFormatted.fontClass}">-${expenseFormatted.text}</div>` : ''}
              </div>
            ` : ''}
          </div>
        `;

        current.setDate(current.getDate() + 1);
      }

      document.getElementById('calendarGrid').innerHTML = html;
    }

    function onCalendarDayClick(dateStr) {
      state.selectedDate = dateStr;
      const todayStr = formatDate(new Date());
      // 오늘이 아닌 다른 날짜를 선택했을 때 body에 표시
      document.body.setAttribute('data-has-selected', dateStr !== todayStr ? 'true' : 'false');
      renderCalendar();
      renderSelectedDateTransactions(dateStr);
    }

    function onCalendarDayDoubleClick(dateStr) {
      openTransactionModal();
      document.getElementById('dateInput').value = dateStr;
    }

    function renderSelectedDateTransactions(dateStr) {
      let dayTransactions = state.transactions.filter(t => t.transactionDate === dateStr);

      // 사용자 필터 적용
      if (state.calendarUserFilter !== 'all') {
        dayTransactions = dayTransactions.filter(t => t.userId === state.calendarUserFilter);
      }

      document.getElementById('calendarSelectedDate').textContent = formatDateKo(dateStr);

      if (dayTransactions.length === 0) {
        document.getElementById('calendarTransactionList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-text">이 날짜에 거래 내역이 없습니다</div>
          </div>
        `;
        return;
      }

      // 모든 거래를 하나의 카드에 리스트로 표시
      let html = '<div class="calendar-transaction-card">';
      html += dayTransactions.map(t => renderCalendarTransactionItem(t)).join('');
      html += '</div>';
      document.getElementById('calendarTransactionList').innerHTML = html;
    }

    function renderCalendarTransactionItem(t) {
      const user = state.users.find(u => u.id === t.userId);
      const category = state.categories.find(c => c.id === t.categoryId);

      const amountClass = t.type === 'income' ? 'income' : (t.type === 'expense' ? 'expense' : 'transfer');
      const amountPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');

      const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${category.icon}</span>${category.name}` : category.name) : (t.type === 'transfer' ? '자산이동' : '');

      return `
        <div class="calendar-transaction-row" onclick="openTransactionDetailModal('${t.id}')">
          <div class="calendar-transaction-info">
            <div class="calendar-transaction-main">
              ${user ? `<span class="transaction-user">${user.name}</span>` : ''}
              <div class="transaction-category">${categoryDisplay}</div>
            </div>
            ${t.memo ? `<div class="transaction-memo">${t.memo}</div>` : ''}
          </div>
          <div class="transaction-amount ${amountClass}">
            ${amountPrefix}${formatMoney(t.amount)}
          </div>
        </div>
      `;
    }

    function renderTransactionList() {
      const { start, end } = getMonthRange(state.currentDate);
      let transactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end;
      });

      if (state.logFilter !== 'all') {
        transactions = transactions.filter(t => t.type === state.logFilter);
      }

      if (state.searchQuery) {
        const query = state.searchQuery.toLowerCase();
        transactions = transactions.filter(t => {
          const category = state.categories.find(c => c.id === t.categoryId);
          const paymentMethod = state.paymentMethods.find(p => p.id === t.paymentMethodId);
          const user = state.users.find(u => u.id === t.userId);

          return (
            (t.memo && t.memo.toLowerCase().includes(query)) ||
            (category && category.name.toLowerCase().includes(query)) ||
            (paymentMethod && paymentMethod.name.toLowerCase().includes(query)) ||
            (user && user.name.toLowerCase().includes(query))
          );
        });
      }

      transactions.sort((a, b) => new Date(b.transactionDate) - new Date(a.transactionDate));

      let html = '';
      if (transactions.length === 0) {
        html = '<div class="empty-state"><div class="empty-state-icon">📝</div><div class="empty-state-text">거래 내역이 없습니다</div></div>';
      } else {
        // 날짜별로 그룹화
        const groupedByDate = {};
        transactions.forEach(t => {
          if (!groupedByDate[t.transactionDate]) {
            groupedByDate[t.transactionDate] = [];
          }
          groupedByDate[t.transactionDate].push(t);
        });

        // 날짜별 카드 생성
        Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
          const dayTransactions = groupedByDate[date];
          const dayIncome = dayTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
          const dayExpense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          html += `<div class="date-group-card">
            <div class="date-group-header">
              <span class="date-group-date">${formatDateKo(date)}</span>
              <span class="date-group-summary">
                ${dayIncome > 0 ? `<span class="income">+${formatMoney(dayIncome)}</span>` : ''}
                ${dayExpense > 0 ? `<span class="expense">-${formatMoney(dayExpense)}</span>` : ''}
              </span>
            </div>
            <div class="date-group-items">
              ${dayTransactions.map(t => renderTransactionItemCompact(t)).join('')}
            </div>
          </div>`;
        });
      }

      document.getElementById('transactionList').innerHTML = html;
    }

    // 날짜 그룹 내에서 사용할 간단한 거래 아이템
    function renderTransactionItemCompact(t) {
      const user = state.users.find(u => u.id === t.userId);
      const category = state.categories.find(c => c.id === t.categoryId);
      const asset = state.assets.find(a => a.id === t.assetId);
      const toAsset = t.toAssetId ? state.assets.find(a => a.id === t.toAssetId) : null;

      const amountClass = t.type === 'income' ? 'income' : (t.type === 'expense' ? 'expense' : 'transfer');
      const amountPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');
      const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${category.icon}</span>${category.name}` : category.name) : (t.type === 'transfer' ? '자산이동' : '');

      return `
        <div class="date-group-item" onclick="openTransactionDetailModal('${t.id}')">
          <div class="date-group-item-left">
            ${user ? `<span class="transaction-user">${user.name}</span>` : ''}
            <span class="transaction-category">${categoryDisplay}</span>
            ${t.memo ? `<span class="transaction-memo-inline">${t.memo}</span>` : ''}
          </div>
          <div class="transaction-amount ${amountClass}">
            ${amountPrefix}${formatMoney(t.amount)}
          </div>
        </div>
      `;
    }

    function renderTransactionItem(t, showDate = false) {
      const user = state.users.find(u => u.id === t.userId);
      const category = state.categories.find(c => c.id === t.categoryId);
      const paymentMethod = state.paymentMethods.find(p => p.id === t.paymentMethodId);
      const asset = state.assets.find(a => a.id === t.assetId);
      const toAsset = t.toAssetId ? state.assets.find(a => a.id === t.toAssetId) : null;

      let methodText = '';
      if (t.type === 'transfer') {
        methodText = `${asset?.name || ''} → ${toAsset?.name || ''}`;
      } else {
        methodText = `${paymentMethod?.name || ''} · ${asset?.name || ''}`;
      }

      const amountClass = t.type === 'income' ? 'income' : (t.type === 'expense' ? 'expense' : 'transfer');
      const amountPrefix = t.type === 'income' ? '+' : (t.type === 'expense' ? '-' : '');

      const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${category.icon}</span>${category.name}` : category.name) : (t.type === 'transfer' ? '자산이동' : '');

      const dateDisplay = showDate ? formatDateKo(t.transactionDate) : '';

      return `
        <div class="transaction-item" onclick="openTransactionDetailModal('${t.id}')">
          <div class="transaction-left">
            ${showDate ? `<span class="transaction-date-badge">${dateDisplay}</span>` : ''}
            ${user ? `<span class="transaction-user">${user.name}</span>` : ''}
            <div class="transaction-category">${categoryDisplay}</div>
            ${methodText ? `<div class="transaction-method">${methodText}</div>` : ''}
            ${t.memo ? `<div class="transaction-method">${t.memo}</div>` : ''}
          </div>
          <div class="transaction-amount ${amountClass}">
            ${amountPrefix}${formatMoney(t.amount)}
          </div>
        </div>
      `;
    }

    function renderAssetsList() {
      const { start, end } = getMonthRange(state.currentDate);
      const today = new Date();
      const currentMonth = state.currentDate.getMonth();
      const currentYear = state.currentDate.getFullYear();

      // 이번달 총 일수 및 남은 일수 계산
      const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
      const daysPassed = today.getMonth() === currentMonth && today.getFullYear() === currentYear
        ? today.getDate()
        : (today > end ? daysInMonth : 0);
      const daysRemaining = daysInMonth - daysPassed;
      const daysPassedPercent = (daysPassed / daysInMonth) * 100;

      // 월 전체 예산 및 지출 합계
      let totalBudget = 0;
      let totalSpent = 0;

      const sortedAssets = [...state.assets].sort((a, b) => a.displayOrder - b.displayOrder);

      sortedAssets.forEach(asset => {
        const budget = asset.budget || 0;

        // 예산이 설정된 자산만 총 예산/지출에 포함
        if (budget > 0) {
          totalBudget += budget;

          const assetTransactions = state.transactions.filter(t => {
            const tDate = new Date(t.transactionDate);
            return tDate >= start && tDate <= end && t.assetId === asset.id && t.type === 'expense';
          });

          totalSpent += assetTransactions.reduce((sum, t) => sum + t.amount, 0);
        }
      });

      const spentPercent = totalBudget > 0 ? (totalSpent / totalBudget) * 100 : 0;
      const remainingBudget = totalBudget - totalSpent;

      // 예산 소진 상태 판단
      let statusClass = 'good';
      let statusText = '양호';
      let statusDesc = '';

      if (totalBudget > 0) {
        if (spentPercent > daysPassedPercent + 10) {
          statusClass = 'bad';
          statusText = '주의';
          statusDesc = `날짜 ${Math.round(daysPassedPercent)}% 경과, 예산 ${Math.round(spentPercent)}% 소진`;
        } else if (spentPercent > daysPassedPercent) {
          statusClass = 'warning';
          statusText = '보통';
          statusDesc = `날짜 ${Math.round(daysPassedPercent)}% 경과, 예산 ${Math.round(spentPercent)}% 소진`;
        } else {
          statusDesc = `날짜 ${Math.round(daysPassedPercent)}% 경과, 예산 ${Math.round(spentPercent)}% 소진`;
        }
      }

      // 월 요약 표시
      let summaryHtml = `
        <div class="budget-summary-card">
          <div class="budget-summary-header">
            <span class="budget-month">${currentMonth + 1}월 예산 현황</span>
            ${totalBudget > 0 ? `<span class="budget-status ${statusClass}">${statusText}</span>` : ''}
          </div>
          <div class="budget-summary-amounts">
            <div class="budget-summary-item">
              <span class="budget-summary-label">예산</span>
              <span class="budget-summary-value">${formatMoney(totalBudget)}</span>
            </div>
            <div class="budget-summary-item">
              <span class="budget-summary-label">지출</span>
              <span class="budget-summary-value expense">${formatMoney(totalSpent)}</span>
            </div>
            <div class="budget-summary-item">
              <span class="budget-summary-label">남음</span>
              <span class="budget-summary-value ${remainingBudget < 0 ? 'expense' : ''}">${formatMoney(remainingBudget)}</span>
            </div>
          </div>
          ${totalBudget > 0 ? `
            <div class="budget-progress-bar">
              <div class="budget-progress-fill ${statusClass}" style="width: ${Math.min(spentPercent, 100)}%"></div>
              <div class="budget-progress-marker" style="left: ${daysPassedPercent}%"></div>
            </div>
            <div class="budget-summary-desc">${statusDesc}</div>
            <div class="budget-days-info">
              <span>경과: ${daysPassed}일</span>
              <span>남음: ${daysRemaining}일</span>
            </div>
          ` : '<div class="budget-summary-desc">예산을 설정해주세요</div>'}
        </div>
      `;

      document.getElementById('budgetSummary').innerHTML = summaryHtml;

      // 개별 자산 예산 카드
      let html = sortedAssets.map(asset => {
        const budget = asset.budget || 0;

        const assetTransactions = state.transactions.filter(t => {
          const tDate = new Date(t.transactionDate);
          return tDate >= start && tDate <= end && t.assetId === asset.id && t.type === 'expense';
        });

        const spent = assetTransactions.reduce((sum, t) => sum + t.amount, 0);
        const remaining = budget - spent;

        let progressPercent = 0;
        let progressClass = 'good';

        if (budget > 0) {
          progressPercent = Math.min((spent / budget) * 100, 100);
          if (progressPercent > daysPassedPercent + 10) {
            progressClass = 'bad';
          } else if (progressPercent > daysPassedPercent) {
            progressClass = 'warning';
          }
        }

        return `
          <div class="asset-card" onclick="showAssetTransactions('${asset.id}', '${asset.name}')">
            <div class="asset-header">
              <span class="asset-name">${asset.name}</span>
              <span class="asset-budget-remaining ${remaining < 0 ? 'expense' : ''}">${remaining >= 0 ? '+' : ''}${formatMoney(remaining)}</span>
            </div>
            ${budget > 0 ? `
              <div class="asset-budget-bar">
                <div class="budget-progress ${progressClass}" style="width: ${progressPercent}%"></div>
              </div>
              <div class="asset-budget-info">
                <span>지출 ${formatMoney(spent)}</span>
                <span>예산 ${formatMoney(budget)}</span>
              </div>
            ` : `
              <div class="asset-budget-info">
                <span>지출 ${formatMoney(spent)}</span>
                <span class="no-budget">예산 미설정</span>
              </div>
            `}
          </div>
        `;
      }).join('');

      document.getElementById('assetsList').innerHTML = html;
    }

    function calculateAssetBalance(assetId) {
      let balance = 0;

      state.transactions.forEach(t => {
        if (t.assetId === assetId) {
          if (t.type === 'income') {
            balance += t.amount;
          } else if (t.type === 'expense') {
            balance -= t.amount;
          } else if (t.type === 'transfer') {
            balance -= t.amount;
          }
        }

        if (t.type === 'transfer' && t.toAssetId === assetId) {
          balance += t.amount;
        }
      });

      return balance;
    }

    function showAssetTransactions(assetId, assetName) {
      const { start, end } = getMonthRange(state.currentDate);
      const currentMonth = state.currentDate.getMonth() + 1;

      const assetTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end &&
               (t.assetId === assetId || (t.type === 'transfer' && t.toAssetId === assetId));
      });

      assetTransactions.sort((a, b) => new Date(b.transactionDate) - new Date(a.transactionDate));

      document.getElementById('assetModalTitle').textContent = `${assetName} ${currentMonth}월 내역`;

      if (assetTransactions.length === 0) {
        document.getElementById('assetTransactionsList').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">📝</div>
            <div class="empty-state-text">거래 내역이 없습니다</div>
          </div>
        `;
      } else {
        // 날짜별로 그룹화
        const groupedByDate = {};
        assetTransactions.forEach(t => {
          if (!groupedByDate[t.transactionDate]) {
            groupedByDate[t.transactionDate] = [];
          }
          groupedByDate[t.transactionDate].push(t);
        });

        let html = '';
        Object.keys(groupedByDate).sort((a, b) => new Date(b) - new Date(a)).forEach(date => {
          const dayTransactions = groupedByDate[date];
          const dayIncome = dayTransactions.filter(t => t.type === 'income').reduce((sum, t) => sum + t.amount, 0);
          const dayExpense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          const dateObj = new Date(date);
          const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][dateObj.getDay()];
          const dateDisplay = `${dateObj.getMonth() + 1}/${dateObj.getDate()} (${dayOfWeek})`;

          html += `<div class="date-group-card">
            <div class="date-group-header">
              <span class="date-group-date">${dateDisplay}</span>
              <div class="date-group-amounts">
                ${dayIncome > 0 ? `<span class="income">+${formatMoney(dayIncome)}</span>` : ''}
                ${dayExpense > 0 ? `<span class="expense">-${formatMoney(dayExpense)}</span>` : ''}
              </div>
            </div>
            <div class="date-group-items">
              ${dayTransactions.map(t => renderTransactionItemCompact(t)).join('')}
            </div>
          </div>`;
        });
        document.getElementById('assetTransactionsList').innerHTML = html;
      }

      document.body.classList.add('modal-open');
      document.getElementById('assetTransactionsModal').classList.add('active');
    }

    function renderStats() {
      const { start, end } = getStatsPeriodRange();
      const monthTransactions = state.transactions.filter(t => {
        const tDate = new Date(t.transactionDate);
        return tDate >= start && tDate <= end && t.type === 'expense';
      });

      let html = '';

      // 사용자별 지출
      const userExpenses = {};
      state.users.forEach(u => {
        userExpenses[u.id] = monthTransactions
          .filter(t => t.userId === u.id)
          .reduce((sum, t) => sum + t.amount, 0);
      });

      const maxUserExpense = Math.max(...Object.values(userExpenses), 1);

      html += '<div class="chart"><div class="chart-title">사용자별 지출</div><div class="bar-chart">';
      state.users.forEach(user => {
        const amount = userExpenses[user.id] || 0;
        const percent = (amount / maxUserExpense) * 100;
        html += `
          <div class="bar-item">
            <div class="bar-label">
              <span>${user.name}</span>
              <span>${formatMoney(amount)}</span>
            </div>
            <div class="bar-bg">
              <div class="bar-fill" style="width: ${percent}%"></div>
            </div>
          </div>
        `;
      });
      html += '</div></div>';

      // 카테고리별 지출
      const categoryExpenses = {};
      monthTransactions.forEach(t => {
        if (!categoryExpenses[t.categoryId]) categoryExpenses[t.categoryId] = 0;
        categoryExpenses[t.categoryId] += t.amount;
      });

      const sortedCategories = Object.entries(categoryExpenses)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      if (sortedCategories.length > 0) {
        const maxCategoryExpense = sortedCategories[0][1];
        html += '<div class="chart"><div class="chart-title">카테고리별 지출</div><div class="bar-chart">';
        sortedCategories.forEach(([catId, amount]) => {
          const category = state.categories.find(c => c.id === catId);
          const percent = (amount / maxCategoryExpense) * 100;
          const categoryDisplay = category ? (category.icon ? `<span class="category-icon">${category.icon}</span>${category.name}` : category.name) : '기타';
          html += `
            <div class="bar-item">
              <div class="bar-label">
                <span>${categoryDisplay}</span>
                <span>${formatMoney(amount)}</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        });
        html += '</div></div>';
      }

      // 결제수단별 지출
      const methodExpenses = {};
      monthTransactions.forEach(t => {
        if (!methodExpenses[t.paymentMethodId]) methodExpenses[t.paymentMethodId] = 0;
        methodExpenses[t.paymentMethodId] += t.amount;
      });

      const sortedMethods = Object.entries(methodExpenses)
        .sort((a, b) => b[1] - a[1]);

      if (sortedMethods.length > 0) {
        const maxMethodExpense = sortedMethods[0][1];
        html += '<div class="chart"><div class="chart-title">결제수단별 지출</div><div class="bar-chart">';
        sortedMethods.forEach(([methodId, amount]) => {
          const method = state.paymentMethods.find(m => m.id === methodId);
          const percent = (amount / maxMethodExpense) * 100;
          html += `
            <div class="bar-item">
              <div class="bar-label">
                <span>${method?.name || '기타'}</span>
                <span>${formatMoney(amount)}</span>
              </div>
              <div class="bar-bg">
                <div class="bar-fill" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        });
        html += '</div></div>';
      }

      document.getElementById('statsCharts').innerHTML = html || '<div class="empty-state"><div class="empty-state-icon">📊</div><div class="empty-state-text">통계 데이터가 없습니다</div></div>';

      renderTrendChart();
    }

    function renderTrendChart() {
      const canvas = document.getElementById('trendChart');
      const ctx = canvas.getContext('2d');

      if (state.trendChart) {
        state.trendChart.destroy();
      }

      let labels = [];
      let expenseData = [];

      if (state.statsFilter === 'week') {
        // 주간: 최근 7일
        for (let i = 6; i >= 0; i--) {
          const date = new Date();
          date.setDate(date.getDate() - i);
          const dateStr = formatDate(date);

          const dayTransactions = state.transactions.filter(t => t.transactionDate === dateStr);
          const expense = dayTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          labels.push(`${date.getMonth() + 1}/${date.getDate()}`);
          expenseData.push(expense);
        }
      } else if (state.statsFilter === 'year') {
        // 연간: 최근 12개월
        for (let i = 11; i >= 0; i--) {
          const date = new Date(state.currentDate);
          date.setMonth(date.getMonth() - i);
          const { start, end } = getMonthRange(date);

          const monthTransactions = state.transactions.filter(t => {
            const tDate = new Date(t.transactionDate);
            return tDate >= start && tDate <= end;
          });

          const expense = monthTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          labels.push(`${date.getMonth() + 1}월`);
          expenseData.push(expense);
        }
      } else {
        // 월간: 최근 6개월
        for (let i = 5; i >= 0; i--) {
          const date = new Date(state.currentDate);
          date.setMonth(date.getMonth() - i);
          const { start, end } = getMonthRange(date);

          const monthTransactions = state.transactions.filter(t => {
            const tDate = new Date(t.transactionDate);
            return tDate >= start && tDate <= end;
          });

          const expense = monthTransactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + t.amount, 0);

          labels.push(`${date.getMonth() + 1}월`);
          expenseData.push(expense);
        }
      }

      state.trendChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: '지출',
              data: expenseData,
              borderColor: '#E74C3C',
              backgroundColor: 'rgba(231, 76, 60, 0.1)',
              tension: 0.4,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                callback: function(value) {
                  return value >= 10000 ? (value / 10000) + '만' : value;
                }
              }
            }
          }
        }
      });
    }

    function renderSelectGrid(containerId, items, selectedId, onClick, allowExpand = false) {
      const container = document.getElementById(containerId);
      if (!container) return;

      const isExpanded = state.expandedSections[containerId];
      const displayItems = (allowExpand && !isExpanded)
        ? items.filter(item => item.isFavorite)
        : items;

      let html = displayItems.map(item => {
        const selected = item.id === selectedId ? 'selected' : '';
        const displayName = item.icon ? `${item.icon} ${item.name}` : item.name;
        return `<div class="select-item ${selected}" onclick="selectItem('${containerId}', '${item.id}')">${displayName}</div>`;
      }).join('');

      if (allowExpand && items.length > displayItems.length) {
        html += `<button class="expand-toggle" onclick="toggleExpand('${containerId}')">
          ${isExpanded ? '접기 ▲' : `더보기 (${items.length - displayItems.length}개) ▼`}
        </button>`;
      }

      container.innerHTML = html;
    }

      renderSelectGrid('assetSelect', assets, state.selectedAsset, null, true);

    function saveTransaction() {
      const amount = parseFormattedNumber(document.getElementById('amountInput').value);
      const date = document.getElementById('dateInput').value;
      const memo = document.getElementById('memoInput').value;

      if (!amount || amount <= 0) {
        alert('금액을 입력해주세요.');
        return;
      }

      if (!state.selectedUser) {
        alert('사용자를 선택해주세요.');
        return;
      }

      if (!state.selectedCategory) {
        alert('카테고리를 선택해주세요.');
        return;
      }

      if (!state.selectedPaymentMethod) {
        alert('결제수단을 선택해주세요.');
        return;
      }

      if (!state.selectedAsset) {
        alert('자산을 선택해주세요.');
        return;
      }

      // 수정 모드인 경우
      if (state.editingTransactionId) {
        const transactionIndex = state.transactions.findIndex(t => t.id === state.editingTransactionId);
        if (transactionIndex !== -1) {
          state.transactions[transactionIndex] = {
            ...state.transactions[transactionIndex],
            type: state.selectedType,
            userId: state.selectedUser,
            amount: amount,
            categoryId: state.selectedCategory,
            paymentMethodId: state.selectedPaymentMethod,
            assetId: state.selectedAsset,
            transactionDate: date,
            memo: memo
          };
        }
        state.editingTransactionId = null;
        document.querySelector('#transactionModal .modal-title').textContent = '거래 추가';
      } else {
        // 새로운 거래 추가
        const transaction = {
          id: generateId(),
          type: state.selectedType,
          userId: state.selectedUser,
          amount: amount,
          categoryId: state.selectedCategory,
          paymentMethodId: state.selectedPaymentMethod,
          assetId: state.selectedAsset,
          transactionDate: date,
          memo: memo,
          createdAt: new Date().toISOString()
        };
        state.transactions.push(transaction);
      }

      saveData();
      renderAll();
      closeModal('transactionModal');
    }

    function saveTransfer() {
      const amount = parseFormattedNumber(document.getElementById('transferAmountInput').value);
      const date = document.getElementById('transferDateInput').value;

      if (!amount || amount <= 0) {
        alert('금액을 입력해주세요.');
        return;
      }

      if (!state.selectedFromAsset) {
        alert('출발 자산을 선택해주세요.');
        return;
      }

      if (!state.selectedToAsset) {
        alert('도착 자산을 선택해주세요.');
        return;
      }

      if (state.selectedFromAsset === state.selectedToAsset) {
        alert('같은 자산으로는 이동할 수 없습니다.');
        return;
      }

      const transaction = {
        id: generateId(),
        type: 'transfer',
        userId: state.users[0].id,
        amount: amount,
        assetId: state.selectedFromAsset,
        toAssetId: state.selectedToAsset,
        transactionDate: date,
        memo: '자산이동',
        createdAt: new Date().toISOString()
      };

      state.transactions.push(transaction);
      saveData();
      renderAll();
      closeModal('transferModal');
    }

    function editTransaction(transactionId) {
      const transaction = state.transactions.find(t => t.id === transactionId);
      if (!transaction) return;

      // 거래 추가 모달을 열고 기존 값으로 채우기
      if (transaction.type === 'transfer') {
        alert('자산이동 거래는 수정할 수 없습니다.');
        return;
      }

      // 수정 모드 설정
      state.editingTransactionId = transactionId;

      // 기존 값 설정
      state.selectedUser = transaction.userId;
      state.selectedType = transaction.type;
      state.selectedCategory = transaction.categoryId;
      state.selectedPaymentMethod = transaction.paymentMethodId;
      state.selectedAsset = transaction.assetId;

      document.getElementById('amountInput').value = formatNumber(transaction.amount);
      document.getElementById('dateInput').value = transaction.transactionDate;
      document.getElementById('memoInput').value = transaction.memo || '';

      // UI 업데이트 - 사용자 선택 활성화
      renderSelectGrid('userSelect', state.users, state.selectedUser);

      // 유형 선택
      document.querySelectorAll('[data-type]').forEach(el => {
        el.classList.remove('selected');
        if (el.dataset.type === transaction.type) {
          el.classList.add('selected');
        }
      });

      renderSelectGrid('categorySelect', state.categories.filter(c => c.type === transaction.type), state.selectedCategory);
      renderSelectGrid('paymentMethodSelect', state.paymentMethods, state.selectedPaymentMethod);
      renderSelectGrid('assetSelect', state.assets, state.selectedAsset);

      // 모달 제목 변경
      document.querySelector('#transactionModal .modal-title').textContent = '거래 수정';

      // 모달 열기 및 스크롤 위치 초기화
      const modal = document.getElementById('transactionModal');
      modal.classList.add('active');
      const modalContent = modal.querySelector('.modal');
      if (modalContent) {
        modalContent.scrollTop = 0;
      }
      document.body.classList.add('modal-open');
    }

    function deleteTransaction(transactionId) {
      state.transactions = state.transactions.filter(t => t.id !== transactionId);
      saveData();
      renderAll();
    }

    function toggleFavorite(type, id) {

      const item = items.find(i => i.id === id);
      if (item) {
        item.isFavorite = !item.isFavorite;

          renderAssetsSettings();

          renderCategoriesSettings();
        }
      }

    function editItem(type, id) {
      const items = state[type];
      const item = items.find(i => i.id === id);
      if (!item) return;

      const newName = prompt('새 이름을 입력하세요:', item.name);
      if (newName && newName.trim()) {
        item.name = newName.trim();
        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }

        renderAll();
      }
    }

    function moveItemUp(type, id) {
      const items = state[type];
      const sorted = [...items].sort((a, b) => {
        if (type === 'categories' && a.type !== b.type) {
          return a.type === 'income' ? -1 : 1;
        }
        return a.displayOrder - b.displayOrder;
      });

      const index = sorted.findIndex(i => i.id === id);
      if (index > 0) {
        const temp = sorted[index].displayOrder;
        sorted[index].displayOrder = sorted[index - 1].displayOrder;
        sorted[index - 1].displayOrder = temp;

        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }
      }
    }

    function moveItemDown(type, id) {
      const items = state[type];
      const sorted = [...items].sort((a, b) => {
        if (type === 'categories' && a.type !== b.type) {
          return a.type === 'income' ? -1 : 1;
        }
        return a.displayOrder - b.displayOrder;
      });

      const index = sorted.findIndex(i => i.id === id);
      if (index < sorted.length - 1) {
        const temp = sorted[index].displayOrder;
        sorted[index].displayOrder = sorted[index + 1].displayOrder;
        sorted[index + 1].displayOrder = temp;

        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }
      }
    }

    function deleteItem(type, id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;

      const items = state[type];
      const index = items.findIndex(i => i.id === id);
      if (index > -1) {
        items.splice(index, 1);
        saveData();

        if (type === 'paymentMethods') {
          renderPaymentMethodsSettings();
        } else if (type === 'assets') {
          renderAssetsSettings();
        } else if (type === 'categories') {
          renderCategoriesSettings();
        }

        renderAll();
      }
    }

    function addNewItem(type, categoryType = null) {
      const name = prompt('이름을 입력하세요:');
      if (!name || !name.trim()) return;

      const items = state[type];
      const maxOrder = Math.max(...items.map(i => i.displayOrder || 0), 0);

      const newItem = {
        id: generateId(),
        name: name.trim(),
        displayOrder: maxOrder + 1,
        isFavorite: true
      };

      if (type === 'categories') {
        newItem.type = categoryType;
        newItem.icon = '📁';
      }

      if (type === 'assets') {
        newItem.balance = 0;
        newItem.budget = 0;
      }

      items.push(newItem);
      saveData();

      if (type === 'paymentMethods') {
        renderPaymentMethodsSettings();
      } else if (type === 'assets') {
        renderAssetsSettings();
      } else if (type === 'categories') {
        renderCategoriesSettings();
      }

      renderAll();
    }

    async function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(tab => {
        tab.classList.remove('active');
      });
      document.getElementById(`${tabName}-content`).classList.add('active');

      document.querySelectorAll('.nav-item').forEach(item => {
        item.classList.remove('active');
      });
      document.querySelector(`[data-tab="${tabName}"]`).classList.add('active');

      // body에 현재 활성 탭 설정 (헤더 표시/숨김 제어)
      document.body.setAttribute('data-active-tab', tabName);

      // 요소들
      const summaryElement = document.querySelector('.summary');
      const monthSelectorElement = document.querySelector('.month-selector');
      const headerAddBtn = document.getElementById('headerAddBtn');

      // 달력 탭
      if (tabName === 'calendar') {
        summaryElement.style.display = 'block';
        monthSelectorElement.style.display = 'flex';
        headerAddBtn.style.display = 'flex';
        renderCalendar();
        renderSelectedDateTransactions(state.selectedDate);
      }
      // 내역, 예산 탭 - 월 선택기만 표시
      else if (tabName === 'log' || tabName === 'assets') {
        summaryElement.style.display = 'none';
        monthSelectorElement.style.display = 'flex';
        headerAddBtn.style.display = 'none';
        if (tabName === 'log') {
          renderTransactionList();
        } else {
          renderAssetsList();
        }
      }
      // 통계, 설정 탭 - 모두 숨김
      else {
        summaryElement.style.display = 'none';
        monthSelectorElement.style.display = 'none';
        headerAddBtn.style.display = 'none';
        if (tabName === 'stats') {
          renderStats();
        }
      }
    }

      });

      document.getElementById('resetTransferAmountBtn').addEventListener('click', () => {
        document.getElementById('transferAmountInput').value = '';
      });

      // 빠른 금액 추가
      document.querySelectorAll('.quick-amount-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const amount = parseInt(btn.dataset.amount);
          const target = btn.dataset.target;

          let input;
          if (target === 'transfer') {
            input = document.getElementById('transferAmountInput');
          } else {
            input = document.getElementById('amountInput');
          }

          const currentAmount = parseFormattedNumber(input.value);
          const newAmount = currentAmount + amount;
          input.value = formatNumber(newAmount);
        });
      });

      // 숫자패드 버튼
      document.querySelectorAll('.numpad-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const num = btn.dataset.num;
          const input = document.getElementById('amountInput');
          const rawValue = input.value.replace(/,/g, '');
          const newValue = rawValue + num;
          input.value = formatNumber(parseInt(newValue) || 0);
        });
      });

      // 거래 저장
      document.getElementById('saveTransaction').addEventListener('click', saveTransaction);

      // 예산 설정
      document.getElementById('setBudgetBtn').addEventListener('click', openBudgetModal);

      // 필터 버튼
      document.querySelectorAll('#logFilters .filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#logFilters .filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.logFilter = btn.dataset.filter;
          renderTransactionList();
        });
      });

      // 통계 필터
      document.querySelectorAll('[data-period]').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          state.statsFilter = btn.dataset.period;
          renderStats();
        });
      });

      // 검색
      document.getElementById('searchInput').addEventListener('input', (e) => {
        state.searchQuery = e.target.value;
        renderTransactionList();
      });

      // 동기화
      document.getElementById('syncData').addEventListener('click', async () => {
        const button = document.getElementById('syncData');
        const originalText = button.innerHTML;

        try {
          button.disabled = true;
          button.innerHTML = '<span>🔄</span><span>동기화 중...</span>';
          button.style.opacity = '0.6';

          await saveToSupabase();
          await loadFromSupabase();
          renderAll();

          // 성공 피드백
          button.innerHTML = '<span>✓</span><span>동기화 완료!</span>';
          button.style.background = 'var(--success)';

          setTimeout(() => {
            button.innerHTML = originalText;
            button.style.background = '';
            button.style.opacity = '';
            button.disabled = false;
          }, 2000);
        } catch (error) {
          // 실패 피드백
          button.innerHTML = '<span>✕</span><span>동기화 실패</span>';
          button.style.background = 'var(--danger)';

          setTimeout(() => {
            button.innerHTML = originalText;
            button.style.background = '';
            button.style.opacity = '';
            button.disabled = false;
          }, 2000);

          console.error('동기화 오류:', error);
        }
      });

      // 결제수단/자산/카테고리 추가
      document.getElementById('addPaymentMethod').addEventListener('click', () => addNewItem('paymentMethods'));
      document.getElementById('addAsset').addEventListener('click', () => addNewItem('assets'));
      document.getElementById('addCategory').addEventListener('click', () => {
        const type = confirm('수입 카테고리입니까? (취소하면 지출)') ? 'income' : 'expense';
        addNewItem('categories', type);
      });

      // 모달 오버레이 클릭 시 닫기
      document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
          if (e.target === overlay) {
            closeModal(overlay.id);
          }
        });
      });
    });

    // Service Worker 등록 (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then((registration) => {
            console.log('Service Worker registered:', registration.scope);
          })
          .catch((error) => {
            console.log('Service Worker registration failed:', error);
          });
      });
    }
  </script>
</body>
</html>
