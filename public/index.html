<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f7f9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>가계부</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/style.css?v=2.1.0" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#ledger">가계부</a
        ><button
          id="sync"
          class="sync-label"
          aria-label="저장 상태 확인 및 다시 동기화"
        >
          연결 중
        </button>
      </header>
      <div id="notice" role="status"></div>
      <main id="main" tabindex="-1"></main>
      <nav class="navigation" aria-label="주 메뉴">
        <a href="#ledger" data-tab="ledger">내역</a
        ><button id="add" class="add-button" aria-label="거래 입력">
          ＋ <span>입력</span></button
        ><a href="#reports" data-tab="reports">리포트</a
        ><a href="#settings" data-tab="settings">설정</a>
      </nav>
    </div>
    <dialog id="editor" aria-labelledby="editor-title"></dialog>
    <dialog id="utility" aria-labelledby="utility-title"></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script type="module" src="/app.js?v=2.1.0"></script>
  </body>
</html>
