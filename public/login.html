<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6c5ce7">
  <title>우리집 가계부 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #28263a;
      background: linear-gradient(160deg, #f3f0ff 0%, #fff 52%, #eef8ff 100%);
    }
    .card {
      width: min(100%, 390px);
      padding: 34px 28px 30px;
      border: 1px solid rgba(108, 92, 231, 0.14);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 22px 55px rgba(75, 65, 145, 0.15);
    }
    .icon {
      display: grid;
      place-items: center;
      width: 58px;
      height: 58px;
      margin-bottom: 20px;
      border-radius: 18px;
      color: white;
      font-size: 28px;
      background: linear-gradient(135deg, #7c6df0, #5f52d9);
    }
    h1 { margin: 0 0 8px; font-size: 25px; }
    p { margin: 0 0 26px; color: #777386; line-height: 1.55; }
    label { display: block; margin-bottom: 9px; font-size: 14px; font-weight: 700; }
    input {
      width: 100%;
      height: 58px;
      border: 1px solid #dedbea;
      border-radius: 16px;
      padding: 0 18px;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.3em;
      outline: none;
      background: #fbfaff;
    }
    input:focus { border-color: #6c5ce7; box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.11); }
    button {
      width: 100%;
      height: 56px;
      margin-top: 16px;
      border: 0;
      border-radius: 16px;
      color: white;
      font-size: 17px;
      font-weight: 750;
      background: linear-gradient(135deg, #7566eb, #5b4fd2);
      cursor: pointer;
    }
    button:disabled { opacity: 0.55; cursor: wait; }
    .message { min-height: 22px; margin: 14px 2px 0; color: #d14343; font-size: 14px; }
    .note { margin-top: 20px; color: #9793a3; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">₩</div>
    <h1>우리집 가계부</h1>
    <p>가족에게 공유된 6자리 번호를 입력해 주세요.</p>
    <form id="loginForm">
      <label for="pin">사용 번호</label>
      <input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus>
      <button id="loginButton" type="submit">가계부 열기</button>
      <div class="message" id="message" role="alert" aria-live="polite"></div>
    </form>
    <div class="note">한 번 로그인하면 이 기기에서는 계속 사용할 수 있습니다.</div>
  </main>
  <script>
    const form = document.getElementById('loginForm');
    const pin = document.getElementById('pin');
    const button = document.getElementById('loginButton');
    const message = document.getElementById('message');

    pin.addEventListener('input', () => {
      pin.value = pin.value.replace(/\D/g, '').slice(0, 6);
      message.textContent = '';
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!/^\d{6}$/.test(pin.value)) {
        message.textContent = '6자리 번호를 입력해 주세요.';
        return;
      }

      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ pin: pin.value })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || '로그인하지 못했습니다.');
        location.replace('/');
      } catch (error) {
        message.textContent = error.message;
        pin.select();
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
